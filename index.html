<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>TWACK CITY 816</title>
    <!-- Tailwind CSS -->
    <script src="https://cdn.tailwindcss.com"></script>
    <!-- Google Fonts -->
    <link href="https://fonts.googleapis.com/css2?family=Space+Grotesk:wght@300;700&family=Unbounded:wght@900&family=JetBrains+Mono:wght@400;700&display=swap" rel="stylesheet">
    
    <style>
        :root {
            --neon-magenta: #ff00ff;
            --neon-cyan: #00ffff;
            --neon-violet: #bc13fe;
            --neon-blue: #22d3ee;
        }

        * {
            box-sizing: border-box;
        }

        body {
            background-color: #030303;
            color: #ffffff;
            font-family: 'Space Grotesk', sans-serif;
            margin: 0;
            padding: 0;
            width: 100vw;
            min-height: 100vh;
            overflow-x: hidden;
            -webkit-tap-highlight-color: transparent;
            display: flex;
            flex-direction: column;
            justify-content: space-between;
        }

        .unbounded {
            font-family: 'Unbounded', sans-serif;
        }
        
        .mono {
            font-family: 'JetBrains Mono', monospace;
        }

        /* Blueprint Grid Background */
        .grid-bg {
            position: fixed;
            top: 0;
            left: 0;
            width: 100vw;
            height: 100vh;
            background-image: 
                linear-gradient(rgba(255, 255, 255, 0.015) 1px, transparent 1px),
                linear-gradient(90deg, rgba(255, 255, 255, 0.015) 1px, transparent 1px);
            background-size: 30px 30px;
            z-index: -1;
        }

        /* Neon Flow Animations */
        @keyframes neon-flow {
            0% { stroke-dashoffset: 1000; filter: brightness(1) drop-shadow(0 0 5px currentColor); }
            50% { filter: brightness(1.5) drop-shadow(0 0 15px currentColor); }
            100% { stroke-dashoffset: 0; filter: brightness(1) drop-shadow(0 0 5px currentColor); }
        }

        @keyframes text-glow-flow {
            0%, 100% { opacity: 0.15; filter: drop-shadow(0 0 5px var(--neon-cyan)); }
            50% { opacity: 0.4; filter: drop-shadow(0 0 20px var(--neon-cyan)); }
        }

        /* Seamless looping Marquee */
        @keyframes marquee {
            0% { transform: translateX(0%); }
            100% { transform: translateX(-33.3333%); }
        }

        .animate-marquee {
            display: inline-block;
            white-space: nowrap;
            animation: marquee 20s linear infinite;
        }

        .grid-accent {
            position: absolute;
            opacity: 0.3;
            animation: fadeOut 1.5s forwards;
            pointer-events: none;
        }

        @keyframes fadeOut {
            from { opacity: 0.4; transform: scale(1); }
            to { opacity: 0; transform: scale(1.5); }
        }

        /* Fluid Skyline Wrapper */
        .skyline-wrapper {
            width: 100%;
            max-width: 850px;
            height: 140px;
            margin: 0 auto;
            z-index: 1;
            overflow: visible;
        }

        @media (min-width: 768px) {
            .skyline-wrapper {
                height: 220px;
            }
        }

        .skyline-svg {
            width: 100%;
            height: 100%;
        }

        /* Animated Building Outlines */
        .b-magenta, .b-cyan, .b-violet, .b-blue {
            stroke-dasharray: 500;
            animation: neon-flow 8s linear infinite;
            transition: all 0.5s ease;
        }

        .b-magenta { fill: #110011; stroke: var(--neon-magenta); color: var(--neon-magenta); }
        .b-cyan { fill: #001111; stroke: var(--neon-cyan); color: var(--neon-cyan); }
        .b-violet { fill: #0a001a; stroke: var(--neon-violet); color: var(--neon-violet); opacity: 0.7; }
        .b-blue { fill: #000a1a; stroke: var(--neon-blue); color: var(--neon-blue); }

        .outlined-text {
            color: transparent;
            -webkit-text-stroke: 1px rgba(255, 255, 255, 0.8);
            transition: -webkit-text-stroke 0.5s ease;
        }

        @media (min-width: 768px) {
            .outlined-text {
                -webkit-text-stroke: 1.5px rgba(255, 255, 255, 0.9);
            }
        }

        .glow-magenta {
            -webkit-text-stroke: 1.5px var(--neon-magenta);
            filter: drop-shadow(0 0 10px var(--neon-magenta));
            transition: all 0.5s ease;
        }

        .glow-cyan {
            -webkit-text-stroke: 1.5px var(--neon-cyan);
            filter: drop-shadow(0 0 10px var(--neon-cyan));
            transition: all 0.5s ease;
        }

        .moving-neon-tag {
            animation: text-glow-flow 4s ease-in-out infinite;
        }

        /* Interactive Cyber Glass Deck */
        .glass-card {
            background: rgba(0, 0, 0, 0.9);
            border: 1px solid var(--neon-magenta);
            backdrop-filter: blur(20px);
            box-shadow: 0 0 25px rgba(188, 19, 254, 0.2);
            z-index: 20;
            width: 100%;
            max-width: 600px;
            transition: border 0.5s ease, box-shadow 0.5s ease;
        }

        .radio-container {
            border: 1px solid var(--neon-cyan);
            background: #000;
            border-radius: 10px;
            overflow: hidden;
            transition: border 0.5s ease;
        }

        .btn-main {
            background: transparent;
            color: #fff;
            border: 2px solid #fff;
            font-weight: 900;
            text-transform: uppercase;
            letter-spacing: 0.15em;
            transition: all 0.3s ease;
            width: 100%;
        }

        .btn-main:hover, .btn-main:active {
            background: var(--neon-magenta);
            border-color: var(--neon-magenta);
            box-shadow: 0 0 20px var(--neon-magenta);
            color: #000;
        }

        .stagger-in {
            animation: staggerIn 0.8s cubic-bezier(0.19, 1, 0.22, 1) forwards;
            opacity: 0;
            transform: translateY(15px);
        }

        @keyframes staggerIn {
            to { opacity: 1; transform: translateY(0); }
        }

        /* Custom Volume Range Input Styling */
        input[type="range"] {
            -webkit-appearance: none;
            appearance: none;
            background: rgba(255, 255, 255, 0.1);
            border-radius: 99px;
            height: 6px;
            outline: none;
        }

        input[type="range"]::-webkit-slider-runnable-track {
            background: linear-gradient(to right, var(--neon-cyan) var(--volume-percent, 80%), rgba(255, 255, 255, 0.1) var(--volume-percent, 80%));
            height: 6px;
            border-radius: 99px;
        }

        input[type="range"]::-webkit-slider-thumb {
            -webkit-appearance: none;
            appearance: none;
            width: 14px;
            height: 14px;
            border-radius: 50%;
            background: #ffffff;
            border: 2px solid var(--neon-cyan);
            cursor: pointer;
            box-shadow: 0 0 8px var(--neon-cyan);
            margin-top: -4px;
        }

        @keyframes orbital-spin {
            0% { transform: rotate(0deg); }
            100% { transform: rotate(360deg); }
        }
        .animate-orbital {
            animation: orbital-spin 4s linear infinite;
        }
    </style>
</head>
<body class="selection:bg-cyan-500 selection:text-black">

    <div class="grid-bg"></div>

    <!-- Main Fluid Content Container -->
    <main class="w-full max-w-5xl mx-auto px-4 py-4 md:py-8 flex flex-col items-center justify-center flex-grow text-center">
        
        <!-- Multi-Color 3D Skyline -->
        <div class="skyline-wrapper stagger-in mb-2" id="skyline-parallax" style="animation-delay: 0.1s;">
            <svg viewBox="0 0 1000 280" xmlns="http://www.w3.org/2000/svg" class="skyline-svg">
                <rect x="50" y="180" width="40" height="100" class="b-violet" />
                <rect x="300" y="140" width="60" height="140" class="b-violet" />
                <rect x="750" y="160" width="40" height="120" class="b-violet" />
                <rect x="120" y="100" width="50" height="180" class="b-blue" />
                <rect x="220" y="130" width="45" height="150" class="b-cyan" />
                <rect x="440" y="80" width="60" height="200" class="b-blue" />
                <rect x="620" y="110" width="50" height="170" class="b-cyan" />
                <rect x="850" y="120" width="45" height="160" class="b-blue" />
                <rect x="180" y="40" width="40" height="240" class="b-magenta" />
                <rect x="380" y="20" width="50" height="260" class="b-magenta" />
                <rect x="550" y="60" width="45" height="220" class="b-magenta" />
                <rect x="700" y="90" width="55" height="190" class="b-cyan" />
            </svg>
        </div>

        <!-- Main Title Header -->
        <h1 class="unbounded text-4xl sm:text-7xl md:text-8xl lg:text-9xl leading-[0.85] mb-6 stagger-in relative z-10" style="animation-delay: 0.2s;">
            <span class="text-white drop-shadow-[0_0_15px_rgba(255,255,255,0.3)]">TWACK</span><br>
            <span class="outlined-text glow-magenta">CITY</span>
            <div class="text-xl sm:text-4xl md:text-5xl mt-2 tracking-[0.3em] glow-cyan">816</div>
        </h1>

        <!-- Cyber Glass Deck Panel -->
        <div class="glass-card p-4 sm:p-6 rounded-xl stagger-in w-full shadow-2xl" style="animation-delay: 0.3s;">
            <div class="flex flex-col gap-4">
                
                <!-- Gateway Action Buttons -->
                <div class="grid grid-cols-1 sm:grid-cols-2 gap-3">
                    <a href="https://lets-get-lit.com" target="_blank" class="btn-main py-3 px-2 flex items-center justify-center rounded-lg text-xs md:text-sm">
                        🚀 CITY GATES ENTER
                    </a>
                    <a href="https://meshcast.io/view.html?geo=usw2&id=TCVIDS" target="_blank" class="btn-main py-3 px-2 flex items-center justify-center rounded-lg text-xs md:text-sm">
                        📺 TC VIDEO PORTAL
                    </a>
                </div>

                <!-- Radio Stream Console -->
                <div class="radio-container flex flex-col">
                    <!-- Ticker Header -->
                    <div class="w-full bg-black/95 border-b border-cyan-500/20 overflow-hidden py-2.5 select-none flex items-center">
                        <div class="animate-marquee font-mono text-xs sm:text-sm md:text-base uppercase tracking-[0.2em] text-[var(--neon-cyan)] drop-shadow-[0_0_6px_var(--neon-cyan)] font-bold">
                            <span id="now-playing-ticker">CONNECTING TO TRANS-NETWORK FEED... &nbsp;&nbsp;&nbsp;&nbsp;&nbsp;&nbsp;&nbsp;&nbsp; • &nbsp;&nbsp;&nbsp;&nbsp;&nbsp;&nbsp;&nbsp;&nbsp;</span>
                        </div>
                    </div>

                    <!-- Audio Player Interactive Area -->
                    <div class="h-[210px] sm:h-[240px] bg-black/90 flex flex-col justify-center items-center relative px-4 py-4">
                        <div class="absolute top-2 left-2 text-[8px] font-mono text-cyan-500/30">STREAM_CORE_v2</div>
                        <div class="absolute top-2 right-2 text-[8px] font-mono text-magenta-500/30">AUTO_DIRECT</div>

                        <!-- HTML5 Audio Element with direct icecast stream fallback -->
                        <audio id="twack-audio" preload="none" crossorigin="anonymous"></audio>

                        <!-- Equalizer Visualizer Bars -->
                        <div class="flex items-end justify-center gap-1 h-12 w-full mb-4" id="visualizer-bars">
                            <div class="w-1 bg-[var(--neon-cyan)] rounded-t-sm transition-all duration-150 shadow-[0_0_6px_var(--neon-cyan)]" style="height: 10%"></div>
                            <div class="w-1 bg-[var(--neon-cyan)] rounded-t-sm transition-all duration-150 shadow-[0_0_6px_var(--neon-cyan)]" style="height: 10%"></div>
                            <div class="w-1 bg-[var(--neon-magenta)] rounded-t-sm transition-all duration-150 shadow-[0_0_6px_var(--neon-magenta)]" style="height: 10%"></div>
                            <div class="w-1 bg-[var(--neon-magenta)] rounded-t-sm transition-all duration-150 shadow-[0_0_6px_var(--neon-magenta)]" style="height: 10%"></div>
                            <div class="w-1 bg-[var(--neon-cyan)] rounded-t-sm transition-all duration-150 shadow-[0_0_6px_var(--neon-cyan)]" style="height: 10%"></div>
                            <div class="w-1 bg-[var(--neon-cyan)] rounded-t-sm transition-all duration-150 shadow-[0_0_6px_var(--neon-cyan)]" style="height: 10%"></div>
                            <div class="w-1 bg-[var(--neon-magenta)] rounded-t-sm transition-all duration-150 shadow-[0_0_6px_var(--neon-magenta)]" style="height: 10%"></div>
                            <div class="w-1 bg-[var(--neon-magenta)] rounded-t-sm transition-all duration-150 shadow-[0_0_6px_var(--neon-magenta)]" style="height: 10%"></div>
                        </div>

                        <!-- Play and Volume Controls -->
                        <div class="flex flex-col items-center justify-center z-10 w-full gap-3">
                            <button id="custom-play-btn" class="relative group w-16 h-16 sm:w-18 sm:h-18 rounded-full flex items-center justify-center border-2 border-white/80 bg-black hover:border-[var(--neon-magenta)] hover:bg-neutral-900 transition-all duration-300 shadow-[0_0_15px_rgba(255,255,255,0.1)] focus:outline-none cursor-pointer">
                                <div id="orbital-ring" class="absolute inset-1 rounded-full border border-dashed border-[var(--neon-cyan)]/30 group-hover:border-[var(--neon-magenta)]/60 animate-orbital"></div>
                                <svg id="play-icon" xmlns="http://www.w3.org/2000/svg" class="h-7 w-7 text-white group-hover:text-[var(--neon-magenta)] transition-colors ml-1" fill="none" viewBox="0 0 24 24" stroke="currentColor">
                                    <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2.5" d="M14.752 11.168l-3.197-2.132A1 1 0 0010 9.87v4.263a1 1 0 001.555.832l3.197-2.132a1 1 0 000-1.664z" />
                                </svg>
                                <svg id="pause-icon" xmlns="http://www.w3.org/2000/svg" class="h-7 w-7 text-white group-hover:text-[var(--neon-magenta)] transition-colors hidden" fill="none" viewBox="0 0 24 24" stroke="currentColor">
                                    <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2.5" d="M10 9v6m4-6v6" />
                                </svg>
                            </button>

                            <!-- Volume Slider Bar -->
                            <div class="flex items-center gap-3 w-40 sm:w-56 px-3 py-1.5 bg-black/60 rounded-full border border-white/10 shadow-[0_0_8px_rgba(0,0,0,0.5)]">
                                <button id="volume-mute-btn" class="text-white hover:text-[var(--neon-cyan)] transition-colors focus:outline-none">
                                    <svg id="speaker-on-icon" xmlns="http://www.w3.org/2000/svg" class="h-4 w-4" fill="none" viewBox="0 0 24 24" stroke="currentColor">
                                        <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M15.536 8.464a5 5 0 010 7.072M18.364 5.636a9 9 0 010 12.728M12 18.75V5.25L7.75 9.5H4.5v5h3.25L12 18.75z" />
                                    </svg>
                                    <svg id="speaker-muted-icon" xmlns="http://www.w3.org/2000/svg" class="h-4 w-4 hidden text-[var(--neon-magenta)]" fill="none" viewBox="0 0 24 24" stroke="currentColor">
                                        <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M5.586 15H4a1 1 0 01-1-1v-4a1 1 0 011-1h1.586l4.707-4.707C10.923 3.663 12 4.109 12 5v14c0 .891-1.077 1.337-1.707.707L5.586 15z" />
                                        <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M17 14l2-2m0 0l2-2m-2 2l-2-2m2 2l2 2" />
                                    </svg>
                                </button>
                                <input id="volume-slider" type="range" min="0" max="100" value="80" class="w-full cursor-pointer" style="--volume-percent: 80%;">
                            </div>
                        </div>
                    </div>
                </div>

            </div>
        </div>
    </main>

    <!-- Footer Bar -->
    <footer class="w-full max-w-5xl mx-auto px-4 py-4 flex flex-col sm:flex-row justify-between items-center gap-4 z-10">
        <div class="stagger-in text-center sm:text-left" style="animation-delay: 0.4s;">
            <div class="unbounded text-2xl sm:text-4xl md:text-5xl outlined-text glow-cyan leading-none mb-1 uppercase moving-neon-tag">#TWACK4LYFE</div>
            <p class="text-[8px] sm:text-[9px] tracking-[0.4em] uppercase text-gray-500">#CUMGETSUM</p>
        </div>

        <div class="text-center sm:text-right stagger-in" style="animation-delay: 0.5s;">
            <div class="text-[8px] sm:text-[9px] tracking-[0.3em] uppercase mb-2 text-[var(--neon-magenta)] font-black" id="footer-vibe-label">TWACK CITY</div>
            <div class="flex gap-3 justify-center sm:justify-end">
                <button onclick="setVibeSector('cyberpunk')" class="w-3 h-3 bg-[#ff00ff] shadow-[0_0_8px_#ff00ff] rounded-full focus:outline-none hover:scale-125 transition-transform" title="Cyber Synth"></button>
                <button onclick="setVibeSector('toxic')" class="w-3 h-3 bg-[#39ff14] shadow-[0_0_8px_#39ff14] rounded-full focus:outline-none hover:scale-125 transition-transform" title="Toxic Hazard"></button>
                <button onclick="setVibeSector('nuclear')" class="w-3 h-3 bg-[#ff6a00] shadow-[0_0_8px_#ff6a00] rounded-full focus:outline-none hover:scale-125 transition-transform" title="Amber Reactor"></button>
                <button onclick="setVibeSector('glacier')" class="w-3 h-3 bg-[#00ffff] shadow-[0_0_8px_#00ffff] rounded-full focus:outline-none hover:scale-125 transition-transform" title="Glacier Core"></button>
            </div>
        </div>
    </footer>

    <script>
        // Vibe Sector Theme Configuration
        function setVibeSector(vibeName) {
            const root = document.documentElement;
            const vibeLabel = document.getElementById('footer-vibe-label');

            if (vibeName === 'cyberpunk') {
                root.style.setProperty('--neon-magenta', '#ff00ff');
                root.style.setProperty('--neon-cyan', '#00ffff');
                root.style.setProperty('--neon-violet', '#bc13fe');
                root.style.setProperty('--neon-blue', '#22d3ee');
                vibeLabel.innerText = "TWACK CITY // SYNTH";
            } else if (vibeName === 'toxic') {
                root.style.setProperty('--neon-magenta', '#39ff14');
                root.style.setProperty('--neon-cyan', '#00f0ff');
                root.style.setProperty('--neon-violet', '#10b981');
                root.style.setProperty('--neon-blue', '#0d9488');
                vibeLabel.innerText = "TWACK CITY // TOXIC";
            } else if (vibeName === 'nuclear') {
                root.style.setProperty('--neon-magenta', '#ff6a00');
                root.style.setProperty('--neon-cyan', '#ffea00');
                root.style.setProperty('--neon-violet', '#f59e0b');
                root.style.setProperty('--neon-blue', '#ef4444');
                vibeLabel.innerText = "TWACK CITY // REACTOR";
            } else if (vibeName === 'glacier') {
                root.style.setProperty('--neon-magenta', '#00d2ff');
                root.style.setProperty('--neon-cyan', '#ffffff');
                root.style.setProperty('--neon-violet', '#a855f7');
                root.style.setProperty('--neon-blue', '#3b82f6');
                vibeLabel.innerText = "TWACK CITY // GLACIER";
            }
            updateVolume(volumeSlider.value);
        }

        // Live Audio Stream & Metadata Configuration
        let primaryStreamUrl = "https://a8.asurahosting.com/listen/t_c_816/radio.mp3";
        let fallbackStreamUrl = "https://a8.asurahosting.com/proxy/t_c_816?mp=/stream";
        let activeStreamUrl = primaryStreamUrl;

        async function fetchNowPlaying() {
            try {
                const response = await fetch('https://a8.asurahosting.com/api/nowplaying/t_c_816');
                if (!response.ok) throw new Error('API failed');

                const data = await response.json();
                let displayString = "TRANS-SPECTRUM BROADCAST ACTIVE";

                if (data && data.station && data.station.listen_url) {
                    let url = data.station.listen_url;
                    if (url.startsWith("http://")) url = url.replace("http://", "https://");
                    activeStreamUrl = url;
                }

                if (data && data.now_playing && data.now_playing.song) {
                    const song = data.now_playing.song;
                    const artist = song.artist ? song.artist.trim().toUpperCase() : "";
                    const title = song.title ? song.title.trim().toUpperCase() : "";

                    if (artist && title) {
                        displayString = `NOW PLAYING: ${artist} — ${title}`;
                    } else if (song.text) {
                        displayString = `NOW PLAYING: ${song.text.toUpperCase()}`;
                    }
                }

                if (data && data.live && data.live.is_live && data.live.streamer_name) {
                    displayString = `🔴 LIVE DJ: ${data.live.streamer_name.toUpperCase()} // ${displayString}`;
                }

                const segment = `${displayString} \u00A0\u00A0\u00A0\u00A0\u00A0\u00A0\u00A0\u00A0 • \u00A0\u00A0\u00A0\u00A0\u00A0\u00A0\u00A0\u00A0 `;
                document.getElementById('now-playing-ticker').innerText = segment + segment + segment;
            } catch (err) {
                console.warn('Metadata query failed, maintaining active stream.', err);
                const backup = "TWACK CITY 816 // LIVE UNDERGROUND BROADCAST • GET TRANSMISSION • ";
                document.getElementById('now-playing-ticker').innerText = backup + backup + backup;
            }
        }

        fetchNowPlaying();
        setInterval(fetchNowPlaying, 10000);

        // Audio Player Controls
        const audio = document.getElementById('twack-audio');
        const playBtn = document.getElementById('custom-play-btn');
        const playIcon = document.getElementById('play-icon');
        const pauseIcon = document.getElementById('pause-icon');
        const visualizerBars = document.getElementById('visualizer-bars').children;
        const orbitalRing = document.getElementById('orbital-ring');

        const volumeSlider = document.getElementById('volume-slider');
        const muteBtn = document.getElementById('volume-mute-btn');
        const speakerOnIcon = document.getElementById('speaker-on-icon');
        const speakerMutedIcon = document.getElementById('speaker-muted-icon');

        let isPlaying = false;
        let animationFrameId = null;
        let lastVolume = 80;

        audio.volume = 0.8;

        function updateVolume(val) {
            audio.volume = val / 100;
            volumeSlider.style.setProperty('--volume-percent', `${val}%`);
            volumeSlider.value = val;
            if (val === 0) {
                audio.muted = true;
                speakerOnIcon.classList.add('hidden');
                speakerMutedIcon.classList.remove('hidden');
            } else {
                audio.muted = false;
                speakerOnIcon.classList.remove('hidden');
                speakerMutedIcon.classList.add('hidden');
                lastVolume = val;
            }
        }

        volumeSlider.addEventListener('input', (e) => updateVolume(e.target.value));
        volumeSlider.addEventListener('change', (e) => updateVolume(e.target.value));

        muteBtn.addEventListener('click', () => {
            if (audio.muted || audio.volume === 0) {
                updateVolume(lastVolume > 0 ? lastVolume : 80);
            } else {
                lastVolume = audio.volume * 100;
                updateVolume(0);
            }
        });

        audio.addEventListener('error', (e) => {
            console.warn("Primary stream failed, attempting fallback stream source.", e);
            if (audio.src === activeStreamUrl) {
                audio.src = fallbackStreamUrl;
                audio.load();
                audio.play().catch(err => console.error("Fallback stream failed as well.", err));
            } else {
                handlePlaybackStop();
                document.getElementById('now-playing-ticker').innerText = "🔴 STREAM OFFLINE — RETRYING CONNECTION... • ";
            }
        });

        function handlePlaybackStop() {
            isPlaying = false;
            playIcon.classList.remove('hidden');
            pauseIcon.classList.add('hidden');
            orbitalRing.classList.remove('animate-spin');
            orbitalRing.classList.add('animate-orbital');
            cancelAnimationFrame(animationFrameId);
            for (let i = 0; i < visualizerBars.length; i++) {
                visualizerBars[i].style.height = "10%";
            }
        }

        function animateVisualizer() {
            if (!isPlaying) {
                for (let i = 0; i < visualizerBars.length; i++) {
                    visualizerBars[i].style.height = "10%";
                }
                return;
            }

            for (let i = 0; i < visualizerBars.length; i++) {
                const randomHeight = Math.floor(Math.random() * 85) + 15;
                visualizerBars[i].style.height = `${randomHeight}%`;
            }

            setTimeout(() => {
                animationFrameId = requestAnimationFrame(animateVisualizer);
            }, 120);
        }

        playBtn.addEventListener('click', () => {
            if (!isPlaying) {
                orbitalRing.classList.remove('animate-orbital');
                orbitalRing.classList.add('animate-spin');

                if (!audio.src || audio.src === "") {
                    audio.src = activeStreamUrl;
                    audio.volume = volumeSlider.value / 100;
                    audio.load();
                }

                audio.play()
                    .then(() => {
                        isPlaying = true;
                        playIcon.classList.add('hidden');
                        pauseIcon.classList.remove('hidden');
                        animateVisualizer();
                    })
                    .catch(err => {
                        console.error("Playback blocked or failed", err);
                        // Try fallback URL immediately on user gesture
                        audio.src = fallbackStreamUrl;
                        audio.load();
                        audio.play().then(() => {
                            isPlaying = true;
                            playIcon.classList.add('hidden');
                            pauseIcon.classList.remove('hidden');
                            animateVisualizer();
                        }).catch(err2 => {
                            handlePlaybackStop();
                            document.getElementById('now-playing-ticker').innerText = "🔴 BROWSER BLOCKED STREAM — TAP AGAIN TO PLAY • ";
                        });
                    });
            } else {
                audio.pause();
                audio.removeAttribute('src');
                audio.load();
                handlePlaybackStop();
            }
        });

        // Background Accent Particles
        const createHighlight = () => {
            const grid = document.querySelector('.grid-bg');
            if (!grid) return;

            const highlight = document.createElement('div');
            const size = window.innerWidth > 768 ? 60 : 40;
            const colors = ['var(--neon-magenta)', 'var(--neon-cyan)', 'var(--neon-violet)'];

            highlight.className = 'grid-accent';
            highlight.style.width = `${size}px`;
            highlight.style.height = `${size}px`;
            highlight.style.left = `${Math.floor(Math.random() * (window.innerWidth / size)) * size}px`;
            highlight.style.top = `${Math.floor(Math.random() * (window.innerHeight / size)) * size}px`;
            highlight.style.backgroundColor = colors[Math.floor(Math.random() * colors.length)];
            highlight.style.boxShadow = `0 0 15px ${highlight.style.backgroundColor}`;

            grid.appendChild(highlight);
            setTimeout(() => { highlight.remove(); }, 1500);
        };

        setInterval(createHighlight, 1200);
    </script>
</body>
</html>
