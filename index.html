<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=5.0, minimum-scale=1.0">
    <title>TWACK CITY 816</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <link href="https://fonts.googleapis.com/css2?family=Space+Grotesk:wght@300;700&family=Unbounded:wght@900&family=JetBrains+Mono:wght@400;700&display=swap" rel="stylesheet">
    
    <style>
        :root {
            --neon-magenta: #ff00ff;
            --neon-cyan: #00ffff;
            --neon-violet: #bc13fe;
            --neon-blue: #22d3ee;
        }

        body {
            background-color: #030303;
            color: #ffffff;
            font-family: 'Space Grotesk', sans-serif;
            margin: 0;
            overflow-x: hidden;
            width: 100%;
            -webkit-tap-highlight-color: transparent;
        }

        .unbounded {
            font-family: 'Unbounded', sans-serif;
        }
        
        .mono {
            font-family: 'JetBrains Mono', monospace;
        }

        /* Blueprint Grid Background */
        .grid-bg {
            position: fixed;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            background-image: 
                linear-gradient(rgba(255, 255, 255, 0.01) 1px, transparent 1px),
                linear-gradient(90deg, rgba(255, 255, 255, 0.01) 1px, transparent 1px);
            background-size: 40px 40px;
            z-index: -1;
        }

        /* Neon Flow Animations */
        @keyframes neon-flow {
            0% { stroke-dashoffset: 1000; filter: brightness(1) drop-shadow(0 0 5px currentColor); }
            50% { filter: brightness(1.5) drop-shadow(0 0 15px currentColor); }
            100% { stroke-dashoffset: 0; filter: brightness(1) drop-shadow(0 0 5px currentColor); }
        }

        @keyframes text-glow-flow {
            0%, 100% { opacity: 0.1; filter: drop-shadow(0 0 5px var(--neon-cyan)); }
            50% { opacity: 0.3; filter: drop-shadow(0 0 20px var(--neon-cyan)); }
        }

        /* Seamless looping Marquee */
        @keyframes marquee {
            0% { transform: translateX(0%); }
            100% { transform: translateX(-33.3333%); }
        }

        .animate-marquee {
            display: inline-block;
            white-space: nowrap;
            animation: marquee 25s linear infinite;
        }

        .grid-accent {
            position: absolute;
            opacity: 0.3;
            animation: fadeOut 1.5s forwards;
        }

        @keyframes fadeOut {
            from { opacity: 0.4; transform: scale(1); }
            to { opacity: 0; transform: scale(1.5); }
        }

        /* 3D Skyline Wrapper */
        .skyline-wrapper {
            position: relative;
            width: 100%;
            max-width: 1000px;
            margin: 0 auto -40px auto;
            height: 180px; 
            z-index: 1;
            perspective: 1200px;
            overflow: visible;
        }

        @media (min-width: 768px) {
            .skyline-wrapper {
                height: 280px;
                margin: 0 auto -80px auto;
            }
        }

        .skyline-svg {
            width: 100%;
            height: 100%;
            transform-style: preserve-3d;
        }

        /* Animated Building Outlines */
        .b-magenta, .b-cyan, .b-violet, .b-blue {
            stroke-dasharray: 500;
            animation: neon-flow 8s linear infinite;
        }

        .b-magenta { fill: #110011; stroke: var(--neon-magenta); color: var(--neon-magenta); }
        .b-cyan { fill: #001111; stroke: var(--neon-cyan); color: var(--neon-cyan); }
        .b-violet { fill: #0a001a; stroke: var(--neon-violet); color: var(--neon-violet); opacity: 0.7; }
        .b-blue { fill: #000a1a; stroke: var(--neon-blue); color: var(--neon-blue); }

        .outlined-text {
            color: transparent;
            -webkit-text-stroke: 1px rgba(255, 255, 255, 0.8);
        }

        @media (min-width: 768px) {
            .outlined-text {
                -webkit-text-stroke: 1.5px rgba(255, 255, 255, 0.9);
            }
        }

        .glow-magenta {
            -webkit-text-stroke: 1.5px var(--neon-magenta);
            filter: drop-shadow(0 0 10px var(--neon-magenta));
        }

        .glow-cyan {
            -webkit-text-stroke: 1.5px var(--neon-cyan);
            filter: drop-shadow(0 0 10px var(--neon-cyan));
        }

        .moving-neon-tag {
            animation: text-glow-flow 4s ease-in-out infinite;
        }

        /* Interactive Cyber Glass Deck */
        .glass-card {
            background: rgba(0, 0, 0, 0.85);
            border: 1px solid rgba(255, 0, 255, 0.3);
            backdrop-filter: blur(20px);
            box-shadow: 0 0 30px rgba(188, 19, 254, 0.15);
            z-index: 20;
            width: 100%;
        }

        .radio-container {
            border: 1px solid rgba(0, 255, 255, 0.3);
            background: #000;
            border-radius: 12px;
            overflow: hidden;
        }

        .btn-main {
            background: transparent;
            color: #fff;
            border: 2px solid #fff;
            font-weight: 900;
            text-transform: uppercase;
            letter-spacing: 0.2em;
            transition: all 0.4s cubic-bezier(0.175, 0.885, 0.32, 1.275);
            width: 100%;
        }

        .btn-main:hover, .btn-main:active {
            background: var(--neon-magenta);
            border-color: var(--neon-magenta);
            box-shadow: 0 0 30px var(--neon-magenta);
            color: #000;
            transform: scale(1.02);
        }

        .stagger-in {
            animation: staggerIn 1s cubic-bezier(0.19, 1, 0.22, 1) forwards;
            opacity: 0;
            transform: translateY(20px);
        }

        @keyframes staggerIn {
            to { opacity: 1; transform: translateY(0); }
        }

        /* Custom Volume Range Input Styling */
        input[type="range"] {
            -webkit-appearance: none;
            appearance: none;
            background: rgba(255, 255, 255, 0.1);
            border-radius: 99px;
            height: 6px;
            outline: none;
            transition: background 0.3s ease;
        }

        input[type="range"]::-webkit-slider-runnable-track {
            background: linear-gradient(to right, var(--neon-cyan) var(--volume-percent, 80%), rgba(255, 255, 255, 0.1) var(--volume-percent, 80%));
            height: 6px;
            border-radius: 99px;
        }

        input[type="range"]::-webkit-slider-thumb {
            -webkit-appearance: none;
            appearance: none;
            width: 16px;
            height: 16px;
            border-radius: 50%;
            background: #ffffff;
            border: 2px solid var(--neon-cyan);
            cursor: pointer;
            box-shadow: 0 0 10px var(--neon-cyan);
            margin-top: -5px;
            transition: transform 0.1s ease, background-color 0.1s ease;
        }

        input[type="range"]::-webkit-slider-thumb:hover {
            transform: scale(1.2);
            background: var(--neon-cyan);
        }

        input[type="range"]::-moz-range-track {
            background: linear-gradient(to right, var(--neon-cyan) var(--volume-percent, 80%), rgba(255, 255, 255, 0.1) var(--volume-percent, 80%));
            height: 6px;
            border-radius: 99px;
        }

        input[type="range"]::-moz-range-thumb {
            width: 16px;
            height: 16px;
            border-radius: 50%;
            background: #ffffff;
            border: 2px solid var(--neon-cyan);
            cursor: pointer;
            box-shadow: 0 0 10px var(--neon-cyan);
            transition: transform 0.1s ease, background-color 0.1s ease;
        }

        /* Rotating ring animation for loading state */
        @keyframes orbital-spin {
            0% { transform: rotate(0deg); }
            100% { transform: rotate(360deg); }
        }
        .animate-orbital {
            animation: orbital-spin 4s linear infinite;
        }
    </style>
</head>
<body class="min-h-screen flex flex-col overflow-x-hidden selection:bg-cyan-500 selection:text-black">

    <div class="grid-bg"></div>
    
    <header class="p-4 md:p-6 flex flex-row justify-center items-center z-50">
    </header>

    <main class="flex-grow flex flex-col items-center justify-center px-4 sm:px-6 text-center py-8">
        
        <!-- Multi-Color 3D Skyline with Moving Outlines -->
        <div class="skyline-wrapper stagger-in" id="skyline-parallax">
            <svg viewBox="0 0 1000 280" xmlns="http://www.w3.org/2000/svg" class="skyline-svg">
                <!-- Distant Layers -->
                <rect x="50" y="180" width="40" height="100" class="b-violet" />
                <rect x="300" y="140" width="60" height="140" class="b-violet" />
                <rect x="750" y="160" width="40" height="120" class="b-violet" />

                <!-- Mid Layers -->
                <rect x="120" y="100" width="50" height="180" class="b-blue" />
                <rect x="220" y="130" width="45" height="150" class="b-cyan" />
                <rect x="440" y="80" width="60" height="200" class="b-blue" />
                <rect x="620" y="110" width="50" height="170" class="b-cyan" />
                <rect x="850" y="120" width="45" height="160" class="b-blue" />

                <!-- Front Layers -->
                <rect x="180" y="40" width="40" height="240" class="b-magenta" />
                <rect x="380" y="20" width="50" height="260" class="b-magenta" />
                <rect x="550" y="60" width="45" height="220" class="b-magenta" />
                <rect x="700" y="90" width="55" height="190" class="b-cyan" />
            </svg>
        </div>
        
        <h1 class="unbounded text-5xl sm:text-7xl md:text-[9rem] lg:text-[11rem] leading-[0.8] mb-8 md:mb-12 stagger-in relative z-10" style="animation-delay: 0.2s;">
            <span class="text-white drop-shadow-[0_0_20px_rgba(255,255,255,0.3)]">TWACK</span><br>
            <span class="outlined-text glow-magenta">CITY</span>
            <div class="text-2xl md:text-6xl mt-2 md:mt-4 tracking-[0.3em] md:tracking-[0.4em] opacity-100 glow-cyan" style="-webkit-text-stroke: 1.5px var(--neon-cyan);">816</div>
        </h1>

        <!-- Upgraded and widened Glass deck container for larger player -->
        <div class="glass-card p-5 md:p-10 rounded-xl max-w-2xl stagger-in w-full" style="animation-delay: 0.4s;">
            <div class="flex flex-col gap-5 md:gap-6">
                <a href="https://lets-get-lit.com" target="_blank" class="btn-main py-4 md:py-5 text-xs md:text-base flex items-center justify-center rounded-lg">
                    CITY GATES ENTER HERE
                </a>

                <!-- Custom Radio Hub console with Scrolling Now Playing Feed -->
                <div class="radio-container flex flex-col">
                    <!-- Real-time Scrolling Ticker Head -->
                    <div class="w-full bg-black/90 border-b border-cyan-500/20 overflow-hidden py-3 select-none flex items-center">
                        <div class="animate-marquee font-mono text-base md:text-2xl uppercase tracking-[0.25em] text-[#00ffff] drop-shadow-[0_0_8px_var(--neon-cyan)] font-bold">
                            <span id="now-playing-ticker">CONNECTING TO TRANS-NETWORK FEED... &nbsp;&nbsp;&nbsp;&nbsp;&nbsp;&nbsp;&nbsp;&nbsp; • &nbsp;&nbsp;&nbsp;&nbsp;&nbsp;&nbsp;&nbsp;&nbsp;</span>
                        </div>
                    </div>

                    <!-- Enriched and Enlarged DJ Player frame -->
                    <div class="h-[240px] md:h-[280px] bg-black/80 flex flex-col justify-center items-center relative overflow-hidden px-6 py-6">
                        <!-- Background tech design patterns -->
                        <div class="absolute inset-0 bg-[radial-gradient(circle_at_center,rgba(0,255,255,0.05)_0%,transparent_70%)] pointer-events-none"></div>
                        <div class="absolute top-2 left-2 text-[8px] font-mono text-cyan-500/30">CORE_MODULE_RX</div>
                        <div class="absolute top-2 right-2 text-[8px] font-mono text-magenta-500/30" id="audio-bitrate">MP3_320KBPS</div>

                        <!-- Custom Audio Element (Smart network interface) -->
                        <audio id="twack-audio" preload="none"></audio>

                        <!-- Dynamic Equalizer Bar Visualizer -->
                        <div class="flex items-end justify-center gap-1.5 h-16 w-full mb-6" id="visualizer-bars">
                            <div class="w-1.5 bg-[#00ffff] rounded-t-sm transition-all duration-150 shadow-[0_0_8px_var(--neon-cyan)]" style="height: 10%"></div>
                            <div class="w-1.5 bg-[#00ffff] rounded-t-sm transition-all duration-150 shadow-[0_0_8px_var(--neon-cyan)]" style="height: 10%"></div>
                            <div class="w-1.5 bg-[#ff00ff] rounded-t-sm transition-all duration-150 shadow-[0_0_8px_var(--neon-magenta)]" style="height: 10%"></div>
                            <div class="w-1.5 bg-[#ff00ff] rounded-t-sm transition-all duration-150 shadow-[0_0_8px_var(--neon-magenta)]" style="height: 10%"></div>
                            <div class="w-1.5 bg-[#00ffff] rounded-t-sm transition-all duration-150 shadow-[0_0_8px_var(--neon-cyan)]" style="height: 10%"></div>
                            <div class="w-1.5 bg-[#00ffff] rounded-t-sm transition-all duration-150 shadow-[0_0_8px_var(--neon-cyan)]" style="height: 10%"></div>
                            <div class="w-1.5 bg-[#ff00ff] rounded-t-sm transition-all duration-150 shadow-[0_0_8px_var(--neon-magenta)]" style="height: 10%"></div>
                            <div class="w-1.5 bg-[#ff00ff] rounded-t-sm transition-all duration-150 shadow-[0_0_8px_var(--neon-magenta)]" style="height: 10%"></div>
                        </div>

                        <!-- Main Creative Play & Volume Controls -->
                        <div class="flex flex-col items-center justify-center z-10 w-full gap-4">
                            <!-- Custom Play Button -->
                            <button id="custom-play-btn" class="relative group w-20 h-20 rounded-full flex items-center justify-center border-2 border-white/80 bg-black hover:border-[#ff00ff] hover:bg-neutral-900 transition-all duration-300 shadow-[0_0_15px_rgba(255,255,255,0.1)] focus:outline-none cursor-pointer">
                                <!-- Inner Neon Ring (Spins when loading/buffering) -->
                                <div id="orbital-ring" class="absolute inset-1 rounded-full border border-dashed border-[#00ffff]/30 group-hover:border-[#ff00ff]/60 animate-orbital"></div>
                                <!-- Play Icon -->
                                <svg id="play-icon" xmlns="http://www.w3.org/2000/svg" class="h-8 w-8 text-white group-hover:text-[#ff00ff] transition-colors ml-1" fill="none" viewBox="0 0 24 24" stroke="currentColor">
                                    <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2.5" d="M14.752 11.168l-3.197-2.132A1 1 0 0010 9.87v4.263a1 1 0 001.555.832l3.197-2.132a1 1 0 000-1.664z" />
                                </svg>
                                <!-- Pause Icon -->
                                <svg id="pause-icon" xmlns="http://www.w3.org/2000/svg" class="h-8 w-8 text-white group-hover:text-[#ff00ff] transition-colors hidden" fill="none" viewBox="0 0 24 24" stroke="currentColor">
                                    <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2.5" d="M10 9v6m4-6v6" />
                                </svg>
                            </button>

                            <!-- Custom Neon Volume Bar -->
                            <div class="flex items-center gap-3 w-48 sm:w-64 px-4 py-1.5 bg-black/60 rounded-full border border-white/10 shadow-[0_0_10px_rgba(0,0,0,0.5)]">
                                <!-- Speaker Mute/Unmute Icon Button -->
                                <button id="volume-mute-btn" class="text-white hover:text-[#00ffff] transition-colors duration-200 focus:outline-none">
                                    <svg id="speaker-on-icon" xmlns="http://www.w3.org/2000/svg" class="h-5 w-5" fill="none" viewBox="0 0 24 24" stroke="currentColor">
                                        <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M15.536 8.464a5 5 0 010 7.072M18.364 5.636a9 9 0 010 12.728M12 18.75V5.25L7.75 9.5H4.5v5h3.25L12 18.75z" />
                                    </svg>
                                    <svg id="speaker-muted-icon" xmlns="http://www.w3.org/2000/svg" class="h-5 w-5 hidden text-[#ff00ff]" fill="none" viewBox="0 0 24 24" stroke="currentColor">
                                        <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M5.586 15H4a1 1 0 01-1-1v-4a1 1 0 011-1h1.586l4.707-4.707C10.923 3.663 12 4.109 12 5v14c0 .891-1.077 1.337-1.707.707L5.586 15z" />
                                        <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M17 14l2-2m0 0l2-2m-2 2l-2-2m2 2l2 2" />
                                    </svg>
                                </button>
                                <!-- Interactive Volume Slider -->
                                <input id="volume-slider" type="range" min="0" max="100" value="80" class="w-full cursor-pointer" style="--volume-percent: 80%;">
                            </div>
                        </div>
                    </div>
                </div>
            </div>
        </div>
    </main>

    <footer class="p-6 md:p-12 flex flex-col md:flex-row justify-between items-center md:items-end gap-8 md:gap-10">
        <div class="stagger-in text-center md:text-left" style="animation-delay: 0.6s;">
            <!-- Animated Background Text -->
            <div class="unbounded text-3xl sm:text-5xl md:text-7xl lg:text-8xl outlined-text glow-cyan leading-none mb-3 uppercase moving-neon-tag">#TWACK4LYFE</div>
            <p class="text-[9px] md:text-[10px] tracking-[0.4em] md:tracking-[0.5em] uppercase text-gray-500">#CUMGETSUM</p>
        </div>
        
        <div class="text-center md:text-right stagger-in" style="animation-delay: 0.7s;">
            <div class="text-[9px] md:text-[10px] tracking-[0.3em] md:tracking-[0.4em] uppercase mb-4 text-[#ff00ff] font-black">TWACK CITY</div>
            <div class="flex gap-4 md:gap-6 justify-center md:justify-end">
                <div class="w-2 h-2 md:w-3 md:h-3 bg-[#ff00ff] shadow-[0_0_10px_var(--neon-magenta)] rounded-full"></div>
                <div class="w-2 h-2 md:w-3 md:h-3 bg-[#00ffff] shadow-[0_0_10px_var(--neon-cyan)] rounded-full"></div>
                <div class="w-2 h-2 md:w-3 md:h-3 bg-white/10 rounded-full"></div>
            </div>
        </div>
    </footer>

    <script>
        const isTouchDevice = 'ontouchstart' in window || navigator.maxTouchPoints > 0;

        // Interactive mouse parallax engine for desktop
        if (!isTouchDevice) {
            document.addEventListener('mousemove', (e) => {
                const x = (e.clientX / window.innerWidth - 0.5);
                const y = (e.clientY / window.innerHeight - 0.5);
                
                const grid = document.querySelector('.grid-bg');
                if (grid) grid.style.transform = `translate(${x * 20}px, ${y * 20}px)`;
                
                const skyline = document.getElementById('skyline-parallax');
                if (skyline) {
                    skyline.style.transform = `rotateY(${x * 10}deg) rotateX(${y * -8}deg) translateZ(20px)`;
                }
                
                const card = document.querySelector('.glass-card');
                if (card) {
                    const rx = y * -8;
                    const ry = x * 8;
                    card.style.transform = `perspective(1000px) rotateX(${rx}deg) rotateY(${ry}deg) translateY(-5px)`;
                }
            });
        }

        // Live track metadata collector (API)
        let fallbackStreamUrl = "https://a8.asurahosting.com/listen/t_c_816/radio.mp3";
        let activeStreamUrl = fallbackStreamUrl;

        // Secure HTTPS transformation helper to prevent mixed-content blocks
        function forceHTTPS(url) {
            if (!url) return "";
            if (url.startsWith("http://")) {
                return url.replace("http://", "https://");
            }
            return url;
        }

        async function fetchNowPlaying() {
            try {
                const response = await fetch('https://a8.asurahosting.com/api/nowplaying/t_c_816');
                if (!response.ok) throw new Error('API failed');
                
                const data = await response.json();
                let displayString = "TRANS-SPECTRUM BROADCAST ACTIVE";

                // Update active streaming URL dynamically and sanitize with HTTPS
                if (data && data.station && data.station.listen_url) {
                    activeStreamUrl = forceHTTPS(data.station.listen_url);
                }

                // Extract track details
                if (data && data.now_playing && data.now_playing.song) {
                    const song = data.now_playing.song;
                    const artist = song.artist ? song.artist.trim().toUpperCase() : "";
                    const title = song.title ? song.title.trim().toUpperCase() : "";
                    
                    if (artist && title) {
                        displayString = `NOW PLAYING: ${artist} — ${title}`;
                    } else if (song.text) {
                        displayString = `NOW PLAYING: ${song.text.toUpperCase()}`;
                    }
                }
                
                // Inject Live DJ name if stream status is live
                if (data && data.live && data.live.is_live && data.live.streamer_name) {
                    displayString = `🔴 LIVE DJ: ${data.live.streamer_name.toUpperCase()} // ${displayString}`;
                }

                const segment = `${displayString} \u00A0\u00A0\u00A0\u00A0\u00A0\u00A0\u00A0\u00A0 • \u00A0\u00A0\u00A0\u00A0\u00A0\u00A0\u00A0\u00A0 `;
                document.getElementById('now-playing-ticker').innerText = segment + segment + segment;
            } catch (err) {
                console.warn('Metadata query failed, falling back to basic broadcast string.', err);
                const backup = "TWACK CITY 816 // TRANSMITTING FROM KANSAS CITY UNDERGROUND CORE • GET TRANSMISSION • ";
                document.getElementById('now-playing-ticker').innerText = backup + backup + backup;
            }
        }

        // Run on launch and poll every 10 seconds
        fetchNowPlaying();
        setInterval(fetchNowPlaying, 10000);

        // Custom HTML5 Audio Player Controls
        const audio = document.getElementById('twack-audio');
        const playBtn = document.getElementById('custom-play-btn');
        const playIcon = document.getElementById('play-icon');
        const pauseIcon = document.getElementById('pause-icon');
        const visualizerBars = document.getElementById('visualizer-bars').children;
        const orbitalRing = document.getElementById('orbital-ring');

        // Custom Volume Controls
        const volumeSlider = document.getElementById('volume-slider');
        const muteBtn = document.getElementById('volume-mute-btn');
        const speakerOnIcon = document.getElementById('speaker-on-icon');
        const speakerMutedIcon = document.getElementById('speaker-muted-icon');

        let isPlaying = false;
        let animationFrameId = null;
        let lastVolume = 80;

        // Configure initial volume profile
        audio.volume = 0.8;

        // Direct volume update logic
        function updateVolume(val) {
            audio.volume = val / 100;
            volumeSlider.style.setProperty('--volume-percent', `${val}%`);
            volumeSlider.value = val;
            
            if (val === 0) {
                audio.muted = true;
                speakerOnIcon.classList.add('hidden');
                speakerMutedIcon.classList.remove('hidden');
            } else {
                audio.muted = false;
                speakerOnIcon.classList.remove('hidden');
                speakerMutedIcon.classList.add('hidden');
                lastVolume = val;
            }
        }

        volumeSlider.addEventListener('input', (e) => {
            updateVolume(e.target.value);
        });

        volumeSlider.addEventListener('change', (e) => {
            updateVolume(e.target.value);
        });

        muteBtn.addEventListener('click', () => {
            if (audio.muted || audio.volume === 0) {
                updateVolume(lastVolume > 0 ? lastVolume : 80);
            } else {
                lastVolume = audio.volume * 100;
                updateVolume(0);
            }
        });

        // Error Handler to capture broadcast connectivity issues smoothly
        audio.addEventListener('error', (e) => {
            console.warn("Audio element reported a load error. Attempting stream reset.", e);
            handlePlaybackStop();
            document.getElementById('now-playing-ticker').innerText = "🔴 TRANSMISSION INTERRUPTED — RETRYING FEED... • ";
        });

        function handlePlaybackStop() {
            isPlaying = false;
            playIcon.classList.remove('hidden');
            pauseIcon.classList.add('hidden');
            orbitalRing.classList.remove('animate-spin');
            orbitalRing.classList.add('animate-orbital');
            cancelAnimationFrame(animationFrameId);
            for (let i = 0; i < visualizerBars.length; i++) {
                visualizerBars[i].style.height = "10%";
            }
        }

        function animateVisualizer() {
            if (!isPlaying) {
                for (let i = 0; i < visualizerBars.length; i++) {
                    visualizerBars[i].style.height = "10%";
                }
                return;
            }

            for (let i = 0; i < visualizerBars.length; i++) {
                const randomHeight = Math.floor(Math.random() * 80) + 15; // 15% to 95%
                visualizerBars[i].style.height = `${randomHeight}%`;
            }

            setTimeout(() => {
                animationFrameId = requestAnimationFrame(animateVisualizer);
            }, 100);
        }

        playBtn.addEventListener('click', () => {
            if (!isPlaying) {
                // Spinning ring indicating connecting state
                orbitalRing.classList.remove('animate-orbital');
                orbitalRing.classList.add('animate-spin');

                // Initialize/Reset stream target
                if (!audio.src || audio.src === "" || audio.src !== activeStreamUrl) {
                    audio.src = activeStreamUrl;
                    // Force the volume configuration to load
                    audio.volume = volumeSlider.value / 100;
                    // Explicitly call load to compile the updated URL pipeline cleanly
                    audio.load();
                }

                audio.play()
                    .then(() => {
                        isPlaying = true;
                        playIcon.classList.add('hidden');
                        pauseIcon.classList.remove('hidden');
                        animateVisualizer();
                    })
                    .catch(err => {
                        console.error("Playback failed due to browser constraints", err);
                        handlePlaybackStop();
                        document.getElementById('now-playing-ticker').innerText = "🔴 BLOCKED BY BROWSER — TAP AGAIN TO UNMUTE DECK • ";
                    });
            } else {
                audio.pause();
                // Flush memory buffers entirely to close background socket connections immediately
                audio.removeAttribute('src'); 
                audio.load();
                handlePlaybackStop();
            }
        });

        // Grid background scanner flare constructor
        const createHighlight = () => {
            const grid = document.querySelector('.grid-bg');
            if (!grid) return;
            
            const highlight = document.createElement('div');
            const size = window.innerWidth > 768 ? 60 : 40;
            const colors = ['var(--neon-magenta)', 'var(--neon-cyan)', 'var(--neon-violet)'];
            
            highlight.className = 'grid-accent';
            highlight.style.width = `${size}px`;
            highlight.style.height = `${size}px`;
            highlight.style.left = Math.floor(Math.random() * (window.innerWidth / size)) * size + 'px';
            highlight.style.top = Math.floor(Math.random() * (window.innerHeight / size)) * size + 'px';
            
            const color = colors[Math.floor(Math.random() * colors.length)];
            highlight.style.background = color;
            highlight.style.boxShadow = `0 0 15px ${color}`;
            
            grid.appendChild(highlight);
            setTimeout(() => highlight.remove(), 1500);
        };

        setInterval(createHighlight, 800);
    </script>
</body>
</html>
