<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>TWACK CITY 816 | THE GATES ARE OPEN</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <link href="https://fonts.googleapis.com/css2?family=Space+Grotesk:wght@300;700&family=Unbounded:wght@900&display=swap" rel="stylesheet">
    <style>
        :root {
            --neon-magenta: #ff00ff;
            --neon-cyan: #00ffff;
            --neon-violet: #bc13fe;
            --neon-blue: #22d3ee;
            --bg-black: #030303;
        }

        body {
            background-color: var(--bg-black);
            color: #ffffff;
            font-family: 'Space Grotesk', sans-serif;
            margin: 0;
            overflow-x: hidden;
            width: 100%;
            overscroll-behavior-y: none;
        }

        .unbounded {
            font-family: 'Unbounded', sans-serif;
        }

        /* Responsive Grid Background */
        .grid-bg {
            position: fixed;
            top: 0;
            left: 0;
            width: 110%;
            height: 110%;
            background-image: 
                linear-gradient(rgba(0, 255, 255, 0.03) 1px, transparent 1px),
                linear-gradient(90deg, rgba(0, 255, 255, 0.03) 1px, transparent 1px);
            background-size: 40px 40px;
            z-index: -1;
            transition: transform 0.2s ease-out;
        }

        @media (min-width: 768px) {
            .grid-bg { background-size: 60px 60px; }
        }

        /* Scanning Line */
        .scanline {
            position: fixed;
            top: 0;
            left: 0;
            width: 100%;
            height: 2px;
            background: linear-gradient(90deg, transparent, var(--neon-cyan), transparent);
            opacity: 0.15;
            z-index: 100;
            animation: scan 6s linear infinite;
            pointer-events: none;
        }

        @keyframes scan {
            0% { top: -5%; }
            100% { top: 105%; }
        }

        /* Large Scrolling Marquee */
        .marquee-container {
            width: 100%;
            overflow: hidden;
            white-space: nowrap;
            background: rgba(0, 255, 255, 0.1);
            border-top: 1px solid rgba(0, 255, 255, 0.2);
            border-bottom: 2px solid rgba(0, 255, 255, 0.4);
            padding: 10px 0;
            margin-bottom: 0;
            position: relative;
        }

        .marquee-content {
            display: inline-block;
            animation: marquee 45s linear infinite;
            padding-left: 100%;
            color: var(--neon-cyan);
            font-weight: 800;
            text-transform: uppercase;
            letter-spacing: 0.15em;
            font-size: 1.1rem; 
            text-shadow: 0 0 8px rgba(0, 255, 255, 0.6);
        }

        @media (min-width: 768px) {
            .marquee-content {
                font-size: 1.85rem;
                letter-spacing: 0.25em;
                padding: 15px 0;
            }
        }

        @keyframes marquee {
            0% { transform: translate(0, 0); }
            100% { transform: translate(-100%, 0); }
        }

        /* Skyline View */
        .skyline-wrapper {
            position: relative;
            width: 100%;
            max-width: 1200px;
            margin: 0 auto -40px auto;
            height: 140px; 
            z-index: 5;
            perspective: 1000px;
            overflow: visible;
        }

        @media (min-width: 768px) {
            .skyline-wrapper {
                height: 280px;
                margin: 0 auto -100px auto;
            }
        }

        .skyline-svg {
            width: 100%;
            height: 100%;
            transform-style: preserve-3d;
        }

        .b-magenta, .b-cyan, .b-violet, .b-blue {
            stroke-dasharray: 600;
            animation: neon-flow 8s linear infinite;
            stroke-width: 1.5;
        }

        @keyframes neon-flow {
            0% { stroke-dashoffset: 1000; filter: brightness(1) drop-shadow(0 0 3px currentColor); }
            50% { filter: brightness(1.4) drop-shadow(0 0 10px currentColor); }
            100% { stroke-dashoffset: 0; filter: brightness(1) drop-shadow(0 0 3px currentColor); }
        }

        .b-magenta { fill: #1a001a; stroke: var(--neon-magenta); }
        .b-cyan { fill: #001a1a; stroke: var(--neon-cyan); }
        .b-violet { fill: #0d0022; stroke: var(--neon-violet); opacity: 0.5; }
        .b-blue { fill: #000d22; stroke: var(--neon-blue); }

        /* Typography */
        .glitch-text {
            position: relative;
            display: inline-block;
        }

        .outlined-text {
            color: transparent;
            -webkit-text-stroke: 1px rgba(255, 255, 255, 0.4);
        }

        .glow-magenta {
            -webkit-text-stroke: 1.5px var(--neon-magenta);
            filter: drop-shadow(0 0 10px var(--neon-magenta));
        }

        .glow-cyan {
            -webkit-text-stroke: 1.5px var(--neon-cyan);
            filter: drop-shadow(0 0 10px var(--neon-cyan));
        }

        /* Glass Card */
        .glass-card {
            background: rgba(5, 5, 5, 0.85);
            border: 1px solid rgba(255, 0, 255, 0.25);
            backdrop-filter: blur(20px);
            box-shadow: 0 0 30px rgba(188, 19, 254, 0.15);
            z-index: 20;
            width: 100%;
            max-width: 95%;
        }

        @media (min-width: 768px) {
            .glass-card { max-width: 650px; }
        }

        /* Primary Gate Button */
        .btn-gate {
            background: transparent;
            color: #fff;
            font-weight: 900;
            text-transform: uppercase;
            letter-spacing: 0.25em;
            transition: all 0.4s cubic-bezier(0.23, 1, 0.32, 1);
            position: relative;
            overflow: hidden;
            touch-action: manipulation;
            border: 2px solid #fff;
            box-shadow: 0 0 15px rgba(255, 255, 255, 0.1);
        }

        .btn-gate:active { transform: scale(0.96); }

        .btn-gate:hover {
            background: var(--neon-magenta);
            border-color: var(--neon-magenta);
            box-shadow: 0 0 40px var(--neon-magenta);
            color: #000;
        }

        /* Play Button Style */
        .btn-play {
            background: rgba(255, 255, 255, 0.05);
            color: var(--neon-cyan);
            font-weight: 800;
            text-transform: uppercase;
            letter-spacing: 0.2em;
            border: 2px solid var(--neon-cyan);
            transition: all 0.3s ease;
            box-shadow: 0 0 15px rgba(0, 255, 255, 0.1);
            cursor: pointer;
        }

        .btn-play:hover {
            background: var(--neon-cyan);
            color: #000;
            box-shadow: 0 0 30px var(--neon-cyan);
        }

        .btn-play:active { transform: scale(0.95); }
        .btn-play:disabled { opacity: 0.5; cursor: wait; }

        .stagger-in {
            animation: staggerIn 1s cubic-bezier(0.16, 1, 0.3, 1) forwards;
            opacity: 0;
            transform: translateY(20px);
        }

        @keyframes staggerIn {
            to { opacity: 1; transform: translateY(0); }
        }

        /* Hidden Audio Element */
        #audio-element { display: none; }
    </style>
</head>
<body class="min-h-screen flex flex-col">

    <div class="scanline"></div>
    <div class="grid-bg" id="grid-bg"></div>
    
    <main class="flex-grow flex flex-col items-center justify-center px-4 text-center py-8">
        
        <!-- Mobile-Scaled Skyline -->
        <div class="skyline-wrapper stagger-in" id="skyline-parallax">
            <svg viewBox="0 0 1000 320" xmlns="http://www.w3.org/2000/svg" class="skyline-svg">
                <rect x="50" y="200" width="40" height="120" class="b-violet" />
                <rect x="300" y="160" width="60" height="160" class="b-violet" />
                <rect x="750" y="180" width="40" height="140" class="b-violet" />
                <rect x="120" y="120" width="50" height="200" class="b-blue" />
                <rect x="220" y="150" width="45" height="170" class="b-cyan" />
                <rect x="440" y="100" width="60" height="220" class="b-blue" />
                <rect x="620" y="130" width="50" height="190" class="b-cyan" />
                <rect x="850" y="140" width="45" height="180" class="b-blue" />
                <rect x="180" y="60" width="40" height="260" class="b-magenta" />
                <rect x="380" y="40" width="50" height="280" class="b-magenta" />
                <rect x="550" y="80" width="45" height="240" class="b-magenta" />
                <rect x="700" y="110" width="55" height="210" class="b-cyan" />
                <line x1="0" y1="318" x2="1000" y2="318" stroke="var(--neon-cyan)" stroke-width="2" opacity="0.3" />
            </svg>
        </div>
        
        <h1 class="unbounded text-5xl sm:text-7xl md:text-[9rem] lg:text-[11rem] leading-[0.85] mb-8 md:mb-12 stagger-in relative z-10" style="animation-delay: 0.1s;">
            <div class="glitch-text">
                <span class="text-white drop-shadow-[0_0_15px_rgba(255,255,255,0.3)]">TWACK</span>
            </div><br>
            <span class="outlined-text glow-magenta">CITY</span>
            <div class="text-2xl sm:text-5xl md:text-7xl mt-2 tracking-[0.3em] glow-cyan" style="-webkit-text-stroke: 1.5px var(--neon-cyan);">816</div>
        </h1>

        <div class="glass-card rounded-xl stagger-in overflow-hidden" style="animation-delay: 0.3s;">
            <!-- Live Metadata Marquee -->
            <div class="marquee-container">
                <div class="marquee-content" id="now-playing">
                    INITIATING UPLINK... SYNCHRONIZING WITH TWACK CITY 816 BROADCAST...
                </div>
            </div>

            <div class="p-6 md:p-10 flex flex-col items-center gap-6">
                <!-- Enter City Gates (Standalone) -->
                <a href="https://lets-get-lit.com" target="_blank" class="btn-gate w-full py-5 md:py-8 text-sm md:text-xl flex items-center justify-center rounded-lg">
                    <span>ENTER CITY GATES</span>
                </a>

                <!-- Unified Play Radio Control -->
                <div class="w-full flex flex-col items-center gap-3">
                    <button id="main-play-btn" onclick="toggleAudio()" class="btn-play w-full py-5 md:py-6 rounded-lg flex items-center justify-center gap-3 text-sm md:text-base">
                        <svg id="play-icon" viewBox="0 0 24 24" class="w-6 h-6 fill-current">
                            <path d="M8 5v14l11-7z"/>
                        </svg>
                        <span id="play-btn-text">PLAY RADIO</span>
                    </button>
                    
                    <div class="flex items-center gap-2 text-[9px] tracking-[0.4em] text-cyan-400 opacity-60 uppercase mt-2">
                        <div class="w-1.5 h-1.5 rounded-full bg-cyan-400 animate-ping"></div>
                        <span>Uplink Active</span>
                    </div>
                </div>
            </div>
        </div>
        
        <!-- Using high-compatibility Icecast proxy URL -->
        <audio id="audio-element" preload="none" crossorigin="anonymous">
            <source src="https://a8.asurahosting.com/radio/8020/radio.mp3" type="audio/mpeg">
            Your browser does not support the audio element.
        </audio>
    </main>

    <footer class="p-6 md:p-12 flex flex-col md:flex-row justify-between items-center gap-8">
        <div class="stagger-in text-center md:text-left" style="animation-delay: 0.5s;">
            <div class="unbounded text-3xl sm:text-5xl md:text-7xl outlined-text glow-cyan leading-none mb-2 uppercase">#TWACK4LYFE</div>
            <p class="text-[8px] md:text-xs tracking-[0.4em] uppercase text-gray-600 font-bold">Protocol Active // Kansas City Sector</p>
        </div>
        
        <div class="text-center md:text-right stagger-in" style="animation-delay: 0.6s;">
            <div class="text-[9px] tracking-[0.3em] uppercase mb-4 text-white/30">EST. 2024 — CITY ARCHIVES</div>
            <div class="flex gap-3 justify-center md:justify-end items-center">
                <div class="w-1.5 h-1.5 bg-magenta-500 shadow-[0_0_10px_var(--neon-magenta)] rounded-full animate-pulse"></div>
                <div class="w-1.5 h-1.5 bg-cyan-500 shadow-[0_0_10px_var(--neon-cyan)] rounded-full animate-pulse" style="animation-delay: 0.5s"></div>
                <div class="h-[1px] w-8 bg-white/10"></div>
                <div class="text-[9px] text-white/20">V.2.5.5</div>
            </div>
        </div>
    </footer>

    <script>
        const grid = document.getElementById('grid-bg');
        const skyline = document.getElementById('skyline-parallax');
        const card = document.querySelector('.glass-card');
        const marquee = document.getElementById('now-playing');
        const audio = document.getElementById('audio-element');
        const playBtn = document.getElementById('main-play-btn');
        const playBtnText = document.getElementById('play-btn-text');
        const playIcon = document.getElementById('play-icon');
        
        const isMobile = /Android|webOS|iPhone|iPad|iPod|BlackBerry|IEMobile|Opera Mini/i.test(navigator.userAgent);

        if (!isMobile) {
            window.addEventListener('mousemove', (e) => {
                const x = (e.clientX / window.innerWidth - 0.5);
                const y = (e.clientY / window.innerHeight - 0.5);
                requestAnimationFrame(() => {
                    grid.style.transform = `translate(${x * -20}px, ${y * -20}px)`;
                    if (skyline) skyline.style.transform = `rotateY(${x * 10}deg) rotateX(${y * -8}deg)`;
                    if (card) card.style.transform = `perspective(1000px) rotateX(${y * -5}deg) rotateY(${x * 5}deg)`;
                });
            });
        }

        let isTogglePending = false;

        async function toggleAudio() {
            if (isTogglePending) return;
            isTogglePending = true;
            playBtn.disabled = true;
            
            try {
                if (audio.paused) {
                    playBtnText.innerText = "CONNECTING...";
                    
                    // High-compatibility URL
                    const streamUrl = "https://a8.asurahosting.com/listen/t_c_816/radio.mp3";
                    
                    // Resetting source to force a live connection
                    audio.pause();
                    audio.src = streamUrl + "?nocache=" + Date.now();
                    audio.type = "audio/mpeg";
                    audio.load();
                    
                    const playPromise = audio.play();
                    
                    if (playPromise !== undefined) {
                        await playPromise;
                        playBtnText.innerText = "STOP RADIO";
                        playIcon.innerHTML = '<path d="M6 19h4V5H6v14zm8-14v14h4V5h-4z"/>';
                    }
                } else {
                    audio.pause();
                    // Nullify src to stop background download/buffering
                    audio.src = "";
                    audio.load();
                    playBtnText.innerText = "PLAY RADIO";
                    playIcon.innerHTML = '<path d="M8 5v14l11-7z"/>';
                }
            } catch (error) {
                console.error("Audio transition failed:", error);
                playBtnText.innerText = "STREAM OFFLINE";
                setTimeout(() => {
                    playBtnText.innerText = "PLAY RADIO";
                }, 3000);
            } finally {
                isTogglePending = false;
                playBtn.disabled = false;
            }
        }

        audio.addEventListener('error', (e) => {
            console.error("Critical Audio Error:", audio.error);
        });

        async function updateMetadata() {
            try {
                const response = await fetch('https://a8.asurahosting.com/api/nowplaying/t_c_816');
                const data = await response.json();
                
                if (data && data.now_playing) {
                    const song = data.now_playing.song.title || "TWACK CITY 816";
                    const artist = data.now_playing.song.artist || "VARIOUS ARTISTS";
                    const listeners = data.listeners.total || 0;
                    
                    const text = `&nbsp;&nbsp;[ LIVE ]&nbsp;&nbsp; ${song} — ${artist} &nbsp;&nbsp;***&nbsp;&nbsp; LISTENERS: ${listeners} &nbsp;&nbsp;***&nbsp;&nbsp; TWACK CITY 816 RADIO &nbsp;&nbsp;***&nbsp;&nbsp;`;
                    if (marquee.innerHTML !== text + text) {
                        marquee.innerHTML = text + text;
                    }
                }
            } catch (e) {
                console.error("Metadata fetch error", e);
            }
        }

        updateMetadata();
        setInterval(updateMetadata, 20000);

        const t = document.querySelector('.glitch-text span');
        setInterval(() => {
            if(Math.random() > 0.97) {
                t.style.opacity = '0.5';
                setTimeout(() => t.style.opacity = '1', 50);
            }
        }, 150);
    </script>
</body>
</html>
