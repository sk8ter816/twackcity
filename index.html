        button, a, input {

        .unbounded { font-family: 'Unbounded', sans-serif; }

        /* Background Grid */
        .grid-bg {
            position: fixed;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;

        /* Matrix Canvas Layer */
        #matrix-canvas {
            position: fixed;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            z-index: -1;
            pointer-events: none;
            opacity: 0.25;
            transition: opacity 0.5s ease;

        @keyframes marquee {
            0% { transform: translateX(0%); }

        .animate-marquee {
            display: inline-block;
            white-space: nowrap;
            animation: marquee 24s linear infinite;
        }

        .grid-accent {
            position: absolute;
            opacity: 0.4;
            animation: fadeOut 1.4s forwards;
            pointer-events: none;

        @keyframes fadeOut {
            from { opacity: 0.6; transform: scale(1); }
            to { opacity: 0; transform: scale(1.6); }

        .skyline-wrapper {
            position: relative;
            width: 100%;
            max-width: 950px;
            margin: 0 auto -20px auto;
            height: 150px;

            perspective: 1200px;

    <script>
        // Cyber Toast Notification Utility
        function showCyberToast(message, duration = 3000) {
            const container = document.getElementById('toast-container');
            if (!container) return;
            const toast = document.createElement('div');
            toast.className = 'glass-panel px-4 py-2.5 rounded-lg border border-cyan-400/50 text-cyan-300 text-xs font-mono shadow-[0_0_15px_rgba(0,255,255,0.3)] flex items-center gap-2 transform translate-y-2 opacity-0 transition-all duration-300 pointer-events-auto';
            toast.innerHTML = `<span class="inline-block w-2 h-2 rounded-full bg-cyan-400 animate-ping"></span><span>${message}</span>`;
            container.appendChild(toast);
            
            requestAnimationFrame(() => {
                toast.classList.remove('translate-y-2', 'opacity-0');
            });

            setTimeout(() => {
                toast.classList.add('opacity-0', 'translate-y-2');
                setTimeout(() => toast.remove(), 300);
            }, duration);
        }

        // Cyber System Terminal Logger Utility
        function appendTerminalLog(msg) {
            const term = document.getElementById('terminal-log');
            if (term) {
                const time = new Date().toLocaleTimeString('en-US', { hour12: false });
                const line = document.createElement('div');
                line.textContent = `[${time}] ${msg}`;
                term.appendChild(line);
                term.scrollTop = term.scrollHeight;
            } else {
                console.log(`[TC816-LOG] ${msg}`);
            }
        }

        // Web Audio API Synthesizer & Sound Effect Engine
        let audioCtx = null;

        function getAudioContext() {
            if (!audioCtx) {
                audioCtx = new (window.AudioContext || window.webkitAudioContext)();
            }
            if (audioCtx.state === 'suspended') {
                audioCtx.resume();
            }
            return audioCtx;
        }

        function playCyberSound(type = 'beep', freq = 600, duration = 0.08) {
            try {
                const ctx = getAudioContext();
                const osc = ctx.createOscillator();
                const gain = ctx.createGain();

                osc.type = 'sine';
                osc.frequency.setValueAtTime(freq, ctx.currentTime);
                gain.gain.setValueAtTime(0.08, ctx.currentTime);
                gain.gain.exponentialRampToValueAtTime(0.001, ctx.currentTime + duration);

                osc.connect(gain);
                gain.connect(ctx.destination);

                osc.start();
                osc.stop(ctx.currentTime + duration);
            } catch (e) {
                // Ignore audio context autoplay restrictions
            }
        }

        // Trigger synth pad sound effects
        function triggerPadSound(soundType) {
            try {
                const ctx = getAudioContext();
                const now = ctx.currentTime;

                if (soundType === 'subdrop') {
                    const osc = ctx.createOscillator();
                    const gain = ctx.createGain();
                    osc.type = 'sine';
                    osc.frequency.setValueAtTime(140, now);
                    osc.frequency.exponentialRampToValueAtTime(35, now + 0.6);
                    gain.gain.setValueAtTime(0.3, now);
                    gain.gain.exponentialRampToValueAtTime(0.001, now + 0.65);
                    osc.connect(gain);
                    gain.connect(ctx.destination);
                    osc.start(now);
                    osc.stop(now + 0.65);
                    appendTerminalLog("🎛️ SUB DROP TRIGGERED (40Hz Ramp)");
                } else if (soundType === 'laser') {
                    const osc = ctx.createOscillator();
                    const gain = ctx.createGain();
                    osc.type = 'sawtooth';
                    osc.frequency.setValueAtTime(1200, now);
                    osc.frequency.exponentialRampToValueAtTime(150, now + 0.25);
                    gain.gain.setValueAtTime(0.15, now);

        // Live track metadata API handler
        let fallbackStreamUrl = "https://a8.asurahosting.com/listen/t_c_816/radio.mp3";
        let activeStreamUrl = fallbackStreamUrl;

        function forceHTTPS(url) {
            if (!url) return "";
            return url.startsWith("http://") ? url.replace("http://", "https://") : url;
        }

        async function fetchNowPlaying() {
            try {
                const response = await fetch('https://a8.asurahosting.com/api/nowplaying/t_c_816');
                if (!response.ok) throw new Error('API failed');

                const data = await response.json();
                let displayString = "TRANS-SPECTRUM BROADCAST ACTIVE";

                if (data && data.station && data.station.listen_url) {
                    activeStreamUrl = forceHTTPS(data.station.listen_url);
                }

                if (data && data.now_playing && data.now_playing.song) {
                    const song = data.now_playing.song;
                    const artist = song.artist ? song.artist.trim().toUpperCase() : "";
                    const title = song.title ? song.title.trim().toUpperCase() : "";

                    if (artist && title) {
                        displayString = `NOW PLAYING: ${artist} — ${title}`;
                    } else if (song.text) {
                        displayString = `NOW PLAYING: ${song.text.toUpperCase()}`;
                    }
                }

                if (data && data.live && data.live.is_live && data.live.streamer_name) {
                    displayString = `🔴 LIVE DJ: ${data.live.streamer_name.toUpperCase()} // ${displayString}`;
                }

                const segment = `${displayString} \u00A0\u00A0\u00A0\u00A0\u00A0\u00A0\u00A0\u00A0 • \u00A0\u00A0\u00A0\u00A0\u00A0\u00A0\u00A0\u00A0 `;
                document.getElementById('now-playing-ticker').innerText = segment;
                document.getElementById('now-playing-ticker-repeat').innerText = segment;
                appendTerminalLog(`Metadata refreshed: ${displayString.slice(0, 42)}...`);
            } catch (err) {
                console.warn('Metadata query fallback active:', err);
                const backup = "TWACK CITY 816 // TRANSMITTING FROM KANSAS CITY UNDERGROUND CORE • ";
                document.getElementById('now-playing-ticker').innerText = backup;
                document.getElementById('now-playing-ticker-repeat').innerText = backup;
            }

        fetchNowPlaying();

        // Audio Player State & Controls
        const audio = document.getElementById('twack-audio');
        const playBtn = document.getElementById('custom-play-btn');
        const playIcon = document.getElementById('play-icon');
        const pauseIcon = document.getElementById('pause-icon');
        const orbitalRing = document.getElementById('orbital-ring');

        const volumeSlider = document.getElementById('volume-slider');
        const muteBtn = document.getElementById('volume-mute-btn');
        const speakerOnIcon = document.getElementById('speaker-on-icon');
        const speakerMutedIcon = document.getElementById('speaker-muted-icon');

        let isPlaying = false;
        let lastVolume = 80;

        audio.volume = 0.8;

        function updateVolume(val) {
            audio.volume = val / 100;
            volumeSlider.style.setProperty('--volume-percent', `${val}%`);
            volumeSlider.value = val;
            if (val == 0) {
                audio.muted = true;
                speakerOnIcon.classList.add('hidden');
                speakerMutedIcon.classList.remove('hidden');
            } else {
                audio.muted = false;
                speakerOnIcon.classList.remove('hidden');
                speakerMutedIcon.classList.add('hidden');
                lastVolume = val;
            }
        }

        volumeSlider.addEventListener('input', (e) => updateVolume(e.target.value));
        volumeSlider.addEventListener('change', (e) => updateVolume(e.target.value));

        muteBtn.addEventListener('click', () => {
            playCyberSound('beep', 500);
            if (audio.muted || audio.volume === 0) {
                updateVolume(lastVolume > 0 ? lastVolume : 80);
            } else {
                lastVolume = audio.volume * 100;
                updateVolume(0);
            }
        });

        audio.addEventListener('error', (e) => {
            console.warn("Stream error encountered:", e);
            handlePlaybackStop();
            document.getElementById('now-playing-ticker').innerText = "🔴 TRANSMISSION INTERRUPTED — TAP PLAY TO RECONNECT • ";
            appendTerminalLog("🔴 Stream error detected. Pipeline reset.");
        });

        function handlePlaybackStop() {
            isPlaying = false;
            playIcon.classList.remove('hidden');
            pauseIcon.classList.add('hidden');
            orbitalRing.classList.remove('animate-spin');
            orbitalRing.classList.add('animate-orbital');
        }

        playBtn.addEventListener('click', () => {
            playCyberSound('beep', isPlaying ? 400 : 800);
            if (!isPlaying) {
                orbitalRing.classList.remove('animate-orbital');
                orbitalRing.classList.add('animate-spin');

                const streamEndpoint = activeStreamUrl || fallbackStreamUrl;
                const freshUrl = streamEndpoint + (streamEndpoint.includes('?') ? '&' : '?') + 'cb=' + Date.now();
                
                audio.src = freshUrl;
                audio.volume = volumeSlider.value / 100;
                audio.load();

                const playPromise = audio.play();
                if (playPromise !== undefined) {
                    playPromise.then(() => {
                        isPlaying = true;
                        playIcon.classList.add('hidden');
                        pauseIcon.classList.remove('hidden');
                        showCyberToast("STREAM CONNECTED // TRANSMISSION ACTIVE");
                        appendTerminalLog("⚡ Stream connected successfully.");
                    }).catch(err => {
                        console.error("Playback prevented by browser policy:", err);
                        handlePlaybackStop();
                        document.getElementById('now-playing-ticker').innerText = "🔴 TAP AGAIN TO UNMUTE AUDIO FEED • ";
                        appendTerminalLog("⚠️ Playback blocked by browser policy. Tap required.");
                    });
                }
            } else {
                audio.pause();
                audio.removeAttribute('src');
                audio.load();
                handlePlaybackStop();
                showCyberToast("STREAM PAUSED");
                appendTerminalLog("⏸️ Stream manually paused.");
            }
        });

        const vizCanvas = document.getElementById('visualizer-canvas');
        const vizCtx = vizCanvas ? vizCanvas.getContext('2d') : null;

        function resizeVizCanvas() {
            if (!vizCanvas) return;
            vizCanvas.width = vizCanvas.offsetWidth;
            vizCanvas.height = vizCanvas.offsetHeight;
        }
        window.addEventListener('resize', resizeVizCanvas);
        resizeVizCanvas();

        // Redesigned Cyber Visualizer Modes:
        // 0 = Synthwave Grid & Sun
        // 1 = Quantum Warp Portal
        // 2 = Cyber Hex Matrix
        // 3 = Laser Oscilloscope & Spectrum
        let currentVizMode = 0;
        const vizModeNames = [
            "🌅 VIZ: SYNTHWAVE GRID & SUN",
            "🌀 VIZ: QUANTUM WARP PORTAL",
            "⚡ VIZ: CYBER HEX MATRIX",
            "📟 VIZ: LASER OSCILLOSCOPE & DB"
        ];

        function cycleVizMode() {
            currentVizMode = (currentVizMode + 1) % vizModeNames.length;
            const btnLabel = document.getElementById('viz-mode-label');
            if (btnLabel) btnLabel.innerText = vizModeNames[currentVizMode];
            playCyberSound('beep', 850);
            showCyberToast(`VISUALIZER MODE: ${vizModeNames[currentVizMode].split(': ')[1]}`);

        let vizPhase = 0;
        const barCount = 32;
        let peakHeights = new Array(barCount).fill(0);

        // Particle field for Quantum Warp Portal
        const starCount = 80;

        for (let s = 0; s < starCount; s++) {
            warpStars.push({
                angle: Math.random() * Math.PI * 2,
                dist: Math.random(),
                speed: Math.random() * 0.015 + 0.005,
                size: Math.random() * 2.5 + 1,
                color: ['#00ffff', '#ff007f', '#a855f7', '#3b82f6'][Math.floor(Math.random() * 4)]
            });
        }

        function renderVisualizer() {
            if (!vizCtx || !vizCanvas) return;

            const w = vizCanvas.width;
            const h = vizCanvas.height;
            const cx = w / 2;
            const cy = h / 2;

            vizCtx.clearRect(0, 0, w, h);
            vizPhase += 0.04;

            // MODE 0: SYNTHWAVE GRID & SUN
            if (currentVizMode === 0) {

                // 1. Synthwave Pulsing Retro Sun
                const sunRadius = Math.min(w, h) * 0.28;
                const sunY = horizonY - 12;
                
                // Sun Gradient (Amber to Magenta)
                const sunGrad = vizCtx.createLinearGradient(cx, sunY - sunRadius, cx, sunY + sunRadius);
                sunGrad.addColorStop(0, '#ffb703');
                sunGrad.addColorStop(0.5, '#ff007f');
                sunGrad.addColorStop(1, '#a855f7');

                vizCtx.save();
                vizCtx.beginPath();
                vizCtx.arc(cx, sunY, sunRadius + (isPlaying ? Math.sin(vizPhase * 3) * 4 : 0), 0, Math.PI * 2);
                vizCtx.fillStyle = sunGrad;
                vizCtx.shadowColor = '#ff007f';
                vizCtx.shadowBlur = isPlaying ? 25 : 10;
                vizCtx.fill();
                vizCtx.restore();

                // Sun Shutter Lines Cutout Effect
                const lineGap = 6;
                vizCtx.fillStyle = 'rgba(3, 3, 8, 0.9)';
                for (let ly = sunY - sunRadius; ly < sunY + sunRadius; ly += lineGap) {
                    const progress = (ly - (sunY - sunRadius)) / (sunRadius * 2);
                    const lineThick = Math.pow(progress, 1.6) * 5 + 1;
                    const shiftOffset = (vizPhase * 15) % lineGap;
                    const currentY = ly + shiftOffset;
                    if (currentY > sunY - sunRadius + 10 && currentY < sunY + sunRadius) {
                        vizCtx.fillRect(cx - sunRadius * 1.2, currentY, sunRadius * 2.4, lineThick);
                    }
                }

                // 2. Horizon Glow Line
                vizCtx.beginPath();
                vizCtx.moveTo(0, horizonY);
                vizCtx.lineTo(w, horizonY);
                vizCtx.strokeStyle = '#00ffff';
                vizCtx.lineWidth = 2;
                vizCtx.shadowColor = '#00ffff';
                vizCtx.shadowBlur = 12;
                vizCtx.stroke();

                // 3. Audio-reactive Synthwave Mountains Silhouette
                vizCtx.beginPath();

                const mountainSegs = 30;
                for (let m = 0; m <= mountainSegs; m++) {
                    const mx = (m / mountainSegs) * w;
                    let mHeight = 0;
                    if (m < 10 || m > 20) { // Side mountain ranges
                        const distFromCenter = Math.abs(m - 15) / 15;
                        const beatNoise = isPlaying ? Math.sin(m * 0.8 + vizPhase * 2.5) * 18 : Math.sin(m * 0.5 + vizPhase) * 4;
                        mHeight = (distFromCenter * 35) + beatNoise;
                    }
                    vizCtx.lineTo(mx, horizonY - Math.max(0, mHeight));
                }
                vizCtx.lineTo(w, horizonY);
                vizCtx.closePath();
                vizCtx.fillStyle = 'rgba(12, 2, 24, 0.85)';
                vizCtx.strokeStyle = '#a855f7';
                vizCtx.lineWidth = 1.5;
                vizCtx.fill();
                vizCtx.stroke();

                // 4. Perspective 3D Grid
                const gridLines = 14;
                const gridSpeed = (vizPhase * 20) % 20;

                // Horizontal moving perspective lines
                vizCtx.strokeStyle = 'rgba(0, 255, 255, 0.4)';
                vizCtx.lineWidth = 1;
                for (let z = 0; z < gridLines; z++) {
                    const zPos = (z * 15 + gridSpeed) % 180;
                    const pY = horizonY + Math.pow(zPos / 180, 2.2) * (h - horizonY);
                    if (pY <= h) {
                        vizCtx.beginPath();
                        vizCtx.moveTo(0, pY);
                        vizCtx.lineTo(w, pY);
                        vizCtx.stroke();
                    }
                }

                // Vanishing Perspective Rays
                const rays = 18;
                for (let r = 0; r <= rays; r++) {
                    const rayX = (r / rays) * w * 2.2 - (w * 0.6);
                    vizCtx.beginPath();
                    vizCtx.moveTo(cx, horizonY);
                    vizCtx.lineTo(rayX, h);
                    vizCtx.stroke();
                }
            }

            // MODE 1: QUANTUM WARP PORTAL
            else if (currentVizMode === 1) {
                // Hyper-speed warp particles
                warpStars.forEach(star => {
                    const speedMult = isPlaying ? 2.5 : 0.8;
                    star.dist += star.speed * speedMult;
                    if (star.dist > 1) {
                        star.dist = 0.02;
                        star.angle = Math.random() * Math.PI * 2;
                    }

                    const currentDist = Math.pow(star.dist, 2.5) * Math.max(w, h) * 0.7;
                    const px = cx + Math.cos(star.angle) * currentDist;
                    const py = cy + Math.sin(star.angle) * currentDist;
                    const tailLength = star.dist * (isPlaying ? 24 : 8);
                    const prevX = cx + Math.cos(star.angle) * (currentDist - tailLength);
                    const prevY = cy + Math.sin(star.angle) * (currentDist - tailLength);

                    vizCtx.beginPath();
                    vizCtx.moveTo(prevX, prevY);
                    vizCtx.lineTo(px, py);
                    vizCtx.strokeStyle = star.color;
                    vizCtx.lineWidth = star.size * star.dist * 1.8;
                    vizCtx.stroke();
                });

                // Rotating 3D Tunnel Polygons (Hexagon Portals)
                const rings = 6;
                for (let r = 0; r < rings; r++) {
                    const ringDist = ((r / rings) + (vizPhase * 0.12)) % 1;
                    const ringRadius = Math.pow(ringDist, 2) * Math.min(w, h) * 0.65;
                    const sides = 6;
                    const rotAngle = vizPhase * 0.4 + (r * 0.2);

                    vizCtx.beginPath();
                    for (let i = 0; i < sides; i++) {
                        const a = (i / sides) * Math.PI * 2 + rotAngle;
                        const rx = cx + Math.cos(a) * ringRadius;
                        const ry = cy + Math.sin(a) * ringRadius;
                        if (i === 0) vizCtx.moveTo(rx, ry);
                        else vizCtx.lineTo(rx, ry);
                    }
                    vizCtx.closePath();

                    const ringColor = r % 2 === 0 ? '#00ffff' : '#ff007f';
                    vizCtx.strokeStyle = ringColor;
                    vizCtx.lineWidth = ringDist * 3 + 0.5;
                    vizCtx.shadowColor = ringColor;
                    vizCtx.shadowBlur = isPlaying ? ringDist * 15 : 2;
                    vizCtx.stroke();
                    vizCtx.shadowBlur = 0;
                }

                // Audio Beat Central Core
                const coreRadius = Math.min(w, h) * (isPlaying ? (0.08 + Math.sin(vizPhase * 4) * 0.02) : 0.06);
                vizCtx.beginPath();
                vizCtx.arc(cx, cy, coreRadius, 0, Math.PI * 2);
                vizCtx.fillStyle = '#ffffff';
                vizCtx.shadowColor = '#00ffff';
                vizCtx.shadowBlur = 20;
                vizCtx.fill();
                vizCtx.shadowBlur = 0;
            }

            // MODE 2: CYBER HEX MATRIX
            else if (currentVizMode === 2) {
                const hexRadius = 22;
                const hexWidth = Math.sqrt(3) * hexRadius;
                const hexHeight = 2 * hexRadius;
                const cols = Math.ceil(w / hexWidth) + 1;
                const rows = Math.ceil(h / (hexHeight * 0.75)) + 1;

                for (let r = 0; r < rows; r++) {
                    for (let c = 0; c < cols; c++) {
                        const xOffset = (r % 2 === 1) ? hexWidth / 2 : 0;
                        const hx = c * hexWidth + xOffset;
                        const hy = r * (hexHeight * 0.75);

                        const distFromCenter = Math.hypot(hx - cx, hy - cy);
                        const wave = Math.sin(distFromCenter * 0.03 - vizPhase * 2.5);
                        
                        let isLit = false;
                        let hexColor = 'rgba(0, 255, 255, 0.12)';

                        if (isPlaying && wave > 0.4) {
                            isLit = true;
                            hexColor = (distFromCenter % 40 < 20) ? 'rgba(255, 0, 127, 0.85)' : 'rgba(0, 255, 255, 0.85)';
                        } else if (wave > 0.7) {
                            hexColor = 'rgba(168, 85, 247, 0.4)';
                        }

                        // Draw Hexagon Path
                        vizCtx.beginPath();
                        for (let i = 0; i < 6; i++) {
                            const angle = (Math.PI / 3) * i + Math.PI / 6;
                            const px = hx + (hexRadius - 3) * Math.cos(angle);
                            const py = hy + (hexRadius - 3) * Math.sin(angle);
                            if (i === 0) vizCtx.moveTo(px, py);
                            else vizCtx.lineTo(px, py);
                        }
                        vizCtx.closePath();

                        if (isLit) {
                            vizCtx.fillStyle = hexColor;
                            vizCtx.shadowColor = hexColor;
                            vizCtx.shadowBlur = 8;
                            vizCtx.fill();
                            vizCtx.shadowBlur = 0;
                        } else {
                            vizCtx.strokeStyle = hexColor;
                            vizCtx.lineWidth = 1;
                            vizCtx.stroke();
                        }
                    }
                }

                // Glowing Data Beams Moving Across Matrix
                const beamY = (vizPhase * 60) % h;
                vizCtx.beginPath();
                vizCtx.moveTo(0, beamY);
                vizCtx.lineTo(w, beamY);
                vizCtx.strokeStyle = 'rgba(0, 255, 255, 0.6)';
                vizCtx.lineWidth = 2;
                vizCtx.shadowColor = '#00ffff';
                vizCtx.shadowBlur = 10;
                vizCtx.stroke();
                vizCtx.shadowBlur = 0;
            }

            // MODE 3: LASER OSCILLOSCOPE & DB SPECTRUM
            else if (currentVizMode === 3) {
                // Top & Bottom Spectrum Bars
                const barWidth = (w / barCount) - 2;
                for (let i = 0; i < barCount; i++) {
                    let barH = isPlaying 
                        ? (Math.sin(i * 0.4 + vizPhase * 3) * 0.5 + 0.5) * (h * 0.35) + Math.random() * 8
                        : (Math.sin(i * 0.3 + vizPhase) * 0.5 + 0.5) * 8 + 3;

                    if (barH > peakHeights[i]) peakHeights[i] = barH;
                    else peakHeights[i] = Math.max(0, peakHeights[i] - 1.2);

                    const x = i * (barWidth + 2);

                    // Top Bar (Inverted)
                    vizCtx.fillStyle = 'rgba(0, 255, 255, 0.5)';
                    vizCtx.fillRect(x, 0, barWidth, barH);

                    // Bottom Bar
                    vizCtx.fillStyle = 'rgba(255, 0, 127, 0.5)';
                    vizCtx.fillRect(x, h - barH, barWidth, barH);

                    // Peak Dots
                    vizCtx.fillStyle = '#ffffff';
                    vizCtx.fillRect(x, Math.min(h - 2, barH + 2), barWidth, 1.5);
                    vizCtx.fillRect(x, Math.max(0, h - peakHeights[i] - 2), barWidth, 1.5);
                }

                // Center Oscilloscope Lissajous Laser Trace
                vizCtx.beginPath();
                vizCtx.lineWidth = 2.5;
                vizCtx.strokeStyle = isPlaying ? '#00ff66' : '#00ffff';
                vizCtx.shadowColor = isPlaying ? '#00ff66' : '#00ffff';
                vizCtx.shadowBlur = isPlaying ? 12 : 4;

                const points = 160;
                const rx = w * 0.32;
                const ry = h * 0.22;

                for (let i = 0; i <= points; i++) {
                    const t = (i / points) * Math.PI * 2;
                    const noise = isPlaying ? Math.sin(t * 10 + vizPhase * 4) * 8 : 0;
                    const x = cx + Math.sin(t * 3 + vizPhase * 1.8) * (rx + noise);
                    const y = cy + Math.cos(t * 4 + vizPhase * 1.2) * (ry + noise);

                    if (i === 0) vizCtx.moveTo(x, y);
                    else vizCtx.lineTo(x, y);
                }
                vizCtx.stroke();
                vizCtx.shadowBlur = 0;

                // Center dB Level Meter HUD Readout
                vizCtx.font = "10px 'JetBrains Mono', monospace";
                vizCtx.fillStyle = "rgba(0, 255, 255, 0.8)";
                const dbVal = isPlaying ? (-6 + Math.sin(vizPhase * 5) * 4).toFixed(1) : "-INF";
                vizCtx.fillText(`PEAK dB: ${dbVal}`, cx - 35, cy + 4);
            }

            requestAnimationFrame(renderVisualizer);
        }
        renderVisualizer();
