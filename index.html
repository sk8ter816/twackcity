<!DOCTYPE html>
<html lang="en" class="dark h-full">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=5.0, user-scalable=yes">
    <title>TWACK CITY 816 // OPTIMIZED UNDERGROUND BROADCAST HUB</title>
    
    <!-- Google Fonts Integration with display=swap for Instant Paint -->
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=JetBrains+Mono:ital,wght@0,400;0,700;1,400&family=Orbitron:wght@800;900&family=Chakra+Petch:ital,wght@0,700;1,700&family=Space+Grotesk:wght@400;600;700&family=Unbounded:wght@400;700;900&display=swap" rel="stylesheet">
    
    <!-- Tailwind CSS CDN -->
    <script src="https://cdn.tailwindcss.com"></script>
    <script>
        tailwind.config = {
            darkMode: 'class',
            theme: {
                extend: {
                    colors: {
                        neonMagenta: '#ff007f',
                        neonCyan: '#00ffff',
                        neonViolet: '#a855f7',
                        neonAmber: '#ffb703',
                        neonGreen: '#00ff66',
                        cyberDark: '#030308',
                        cyberPanel: '#0a0a12'
                    }
                }
            }
        }
    </script>

    <style>
        :root {
            --neon-magenta: #ff007f;
            --neon-cyan: #00ffff;
            --neon-violet: #a855f7;
            --neon-amber: #ffb703;
            --neon-green: #00ff66;
            --bg-dark: #030308;
            --volume-percent: 80%;
        }

        html, body {
            background-color: var(--bg-dark);
            color: #ffffff;
            font-family: 'Space Grotesk', sans-serif;
            margin: 0;
            padding: 0;
            overflow-x: hidden;
            width: 100%;
            min-height: 100dvh;
            -webkit-tap-highlight-color: transparent;
            text-rendering: optimizeSpeed;
        }

        button, a, input {
            touch-action: manipulation;
        }

        .unbounded { font-family: 'Unbounded', sans-serif; }
        .mono { font-family: 'JetBrains Mono', monospace; }
        .orbitron { font-family: 'Orbitron', sans-serif; }
        .chakra { font-family: 'Chakra Petch', sans-serif; }

        /* Title Backing Aura for Ultra Visibility */
        .title-backdrop-aura {
            background: rgba(3, 3, 12, 0.88) !important;
            backdrop-filter: blur(20px);
            -webkit-backdrop-filter: blur(20px);
            padding: 0.5rem 0.85rem;
            border-radius: 1.25rem;
            box-shadow: 0 0 45px rgba(0, 0, 0, 0.95);
        }

        @media (min-width: 640px) {
            .title-backdrop-aura {
                padding: 0.85rem 1.25rem;
                border-radius: 1.75rem;
            }
        }

        /* Hardware-Accelerated Rainbow Text Glow Animation */
        @keyframes rainbow-text-glow {
            0% { filter: drop-shadow(0 0 10px #ff0055) drop-shadow(2px 2px 0px #ff0055) drop-shadow(-2px -2px 0px #00ffff); }
            25% { filter: drop-shadow(0 0 10px #ffeb3b) drop-shadow(2px 2px 0px #ffeb3b) drop-shadow(-2px -2px 0px #a855f7); }
            50% { filter: drop-shadow(0 0 10px #00ff66) drop-shadow(2px 2px 0px #00ff66) drop-shadow(-2px -2px 0px #ff007f); }
            75% { filter: drop-shadow(0 0 10px #00ffff) drop-shadow(2px 2px 0px #00ffff) drop-shadow(-2px -2px 0px #ffb703); }
            100% { filter: drop-shadow(0 0 10px #ff0055) drop-shadow(2px 2px 0px #ff0055) drop-shadow(-2px -2px 0px #00ffff); }
        }

        .cyber-title-twack {
            color: #ffffff;
            -webkit-text-stroke: 2px #000000;
            text-shadow: 0 0 8px #ffffff, 2px 2px 0px #000000, -2px -2px 0px #000000;
            animation: rainbow-text-glow 3.5s linear infinite;
            will-change: filter;
        }

        @media (min-width: 640px) {
            .cyber-title-twack {
                -webkit-text-stroke: 3px #000000;
                text-shadow: 0 0 12px #ffffff, 3px 3px 0px #000000, -3px -3px 0px #000000;
            }
        }

        .cyber-title-city {
            color: #ffffff;
            -webkit-text-stroke: 2px #000000;
            text-shadow: 0 0 8px #ffffff, 2px 2px 0px #000000, -2px -2px 0px #000000;
            animation: rainbow-text-glow 3.5s linear infinite 1.75s;
            will-change: filter;
        }

        @media (min-width: 640px) {
            .cyber-title-city {
                -webkit-text-stroke: 3px #000000;
                text-shadow: 0 0 12px #ffffff, 3px 3px 0px #000000, -3px -3px 0px #000000;
            }
        }

        .badge-816 {
            background: rgba(3, 3, 12, 0.9) !important;
            backdrop-filter: blur(12px);
            -webkit-backdrop-filter: blur(12px);
            box-shadow: 0 0 25px rgba(0, 0, 0, 0.8);
        }

        /* Background Grid */
        .grid-bg {
            position: fixed;
            top: 0;
            left: 0;
            width: 100vw;
            height: 100dvh;
            background-color: var(--bg-dark);
            background-image: 
                linear-gradient(rgba(0, 255, 255, 0.04) 1px, transparent 1px),
                linear-gradient(90deg, rgba(0, 255, 255, 0.04) 1px, transparent 1px);
            background-size: 32px 32px;
            z-index: 0;
            pointer-events: none;
        }

        /* Visualizer Canvas Layer */
        #bg-visualizer {
            position: fixed;
            top: 0;
            left: 0;
            width: 100vw;
            height: 100dvh;
            z-index: 1;
            pointer-events: none;
            opacity: 0.95;
            display: block;
            filter: drop-shadow(0 0 12px rgba(0, 255, 255, 0.35));
            will-change: transform;
            transform: translateZ(0);
        }

        @keyframes marquee {
            0% { transform: translate3d(0%, 0, 0); }
            100% { transform: translate3d(-50%, 0, 0); }
        }

        .animate-marquee {
            display: inline-block;
            white-space: nowrap;
            animation: marquee 22s linear infinite;
            will-change: transform;
        }

        /* Skyline Wrapper & Floating Motion */
        .skyline-wrapper {
            position: relative;
            width: 100%;
            max-width: 720px;
            margin: 0 auto;
            z-index: 1;
            perspective: 1000px;
            overflow: hidden;
            aspect-ratio: 1000 / 280;
            min-height: 110px;
            animation: float-skyline 6s ease-in-out infinite alternate;
            will-change: transform;
        }

        @keyframes float-skyline {
            0% { transform: translate3d(0, 0px, 0); }
            100% { transform: translate3d(0, -4px, 0); }
        }

        .skyline-svg {
            width: 100%;
            height: 100%;
            display: block;
            transform-style: preserve-3d;
        }

        /* Skyline Color Cycling Animations */
        @keyframes skyline-color-flow {
            0% { stroke: var(--neon-cyan); filter: drop-shadow(0 0 8px var(--neon-cyan)); }
            25% { stroke: var(--neon-magenta); filter: drop-shadow(0 0 8px var(--neon-magenta)); }
            50% { stroke: var(--neon-amber); filter: drop-shadow(0 0 8px var(--neon-amber)); }
            75% { stroke: var(--neon-green); filter: drop-shadow(0 0 8px var(--neon-green)); }
            100% { stroke: var(--neon-cyan); filter: drop-shadow(0 0 8px var(--neon-cyan)); }
        }

        .b-violet, .b-blue, .b-cyan, .b-magenta {
            animation: skyline-color-flow 8s linear infinite;
            will-change: stroke, filter;
        }

        .b-violet { fill: #0c0218; stroke-width: 2.5; animation-delay: 0s; }
        .b-blue { fill: #02121e; stroke-width: 2.5; animation-delay: -2s; }
        .b-cyan { fill: #011b22; stroke-width: 3; animation-delay: -4s; }
        .b-magenta { fill: #1d001d; stroke-width: 3; animation-delay: -6s; }

        .skyline-horizon {
            animation: skyline-color-flow 8s linear infinite -1s;
        }

        .glass-panel {
            background: rgba(10, 10, 18, 0.45);
            backdrop-filter: blur(16px);
            -webkit-backdrop-filter: blur(16px);
            border: 1px solid rgba(0, 255, 255, 0.3);
            box-shadow: 0 15px 45px rgba(0, 0, 0, 0.7), 0 0 30px rgba(0, 255, 255, 0.1);
        }

        @property --rainbow-angle {
            syntax: '<angle>';
            initial-value: 0deg;
            inherits: false;
        }

        @keyframes rotate-rainbow {
            0% { --rainbow-angle: 0deg; }
            100% { --rainbow-angle: 360deg; }
        }

        .rainbow-border-box {
            position: relative;
            background: rgba(8, 8, 16, 0.35) !important;
            backdrop-filter: blur(12px);
            -webkit-backdrop-filter: blur(12px);
            box-shadow: 0 0 15px rgba(0, 255, 255, 0.15), 0 15px 40px rgba(0, 0, 0, 0.8);
        }

        .rainbow-border-box::before {
            content: '';
            position: absolute;
            inset: 0;
            border-radius: inherit;
            padding: 2px;
            background: conic-gradient(
                from var(--rainbow-angle),
                #ff0055, #ff7700, #ffeb3b, #00ff66, #00ffff, #7000ff, #ff007f, #ff0055
            );
            -webkit-mask: linear-gradient(#fff 0 0) content-box, linear-gradient(#fff 0 0);
            -webkit-mask-composite: xor;
                    mask-composite: exclude;
            animation: rotate-rainbow 3.5s linear infinite;
            pointer-events: none;
            z-index: 1;
        }

        .rainbow-border-box::after {
            content: '';
            position: absolute;
            inset: -2px;
            border-radius: inherit;
            padding: 2px;
            background: conic-gradient(
                from var(--rainbow-angle),
                #ff0055, #ff7700, #ffeb3b, #00ff66, #00ffff, #7000ff, #ff007f, #ff0055
            );
            -webkit-mask: linear-gradient(#fff 0 0) content-box, linear-gradient(#fff 0 0);
            -webkit-mask-composite: xor;
                    mask-composite: exclude;
            animation: rotate-rainbow 3.5s linear infinite;
            z-index: 0;
            filter: blur(4px);
            opacity: 0.6;
            pointer-events: none;
        }

        .btn-cyber-rainbow {
            position: relative;
            background: rgba(15, 15, 30, 0.35) !important;
            backdrop-filter: blur(10px);
            -webkit-backdrop-filter: blur(10px);
            box-shadow: 0 0 10px rgba(0, 255, 255, 0.2);
        }

        .btn-cyber-rainbow::before {
            content: '';
            position: absolute;
            inset: 0;
            border-radius: inherit;
            padding: 2px;
            background: conic-gradient(
                from var(--rainbow-angle),
                #ff0055, #ff9900, #ffff00, #00ff66, #00ffff, #9900ff, #ff007f, #ff0055
            );
            -webkit-mask: linear-gradient(#fff 0 0) content-box, linear-gradient(#fff 0 0);
            -webkit-mask-composite: xor;
                    mask-composite: exclude;
            animation: rotate-rainbow 3s linear infinite;
            pointer-events: none;
            z-index: 1;
        }

        .btn-cyber-rainbow::after {
            content: '';
            position: absolute;
            inset: -2px;
            border-radius: inherit;
            padding: 2px;
            background: conic-gradient(
                from var(--rainbow-angle),
                #ff0055, #ff9900, #ffff00, #00ff66, #00ffff, #9900ff, #ff007f, #ff0055
            );
            -webkit-mask: linear-gradient(#fff 0 0) content-box, linear-gradient(#fff 0 0);
            -webkit-mask-composite: xor;
                    mask-composite: exclude;
            animation: rotate-rainbow 3s linear infinite;
            z-index: 0;
            filter: blur(4px);
            opacity: 0.55;
            pointer-events: none;
        }

        .glow-magenta { text-shadow: 0 0 15px var(--neon-magenta), 0 0 30px var(--neon-magenta); }
        .glow-cyan { color: var(--neon-cyan); text-shadow: 0 0 12px var(--neon-cyan), 0 0 25px var(--neon-cyan); }

        /* Animated Hashtag Keyframes */
        @keyframes pulse-cyan-glow {
            0%, 100% {
                color: #00ffff;
                text-shadow: 0 0 12px #00ffff, 0 0 25px #00ffff, 0 0 45px #00ffff;
                transform: scale(1);
            }
            50% {
                color: #ffffff;
                text-shadow: 0 0 25px #00ffff, 0 0 50px #00ffff, 0 0 90px #00ffff;
                transform: scale(1.08);
            }
        }

        @keyframes pulse-magenta-glow {
            0%, 100% {
                color: #ff007f;
                text-shadow: 0 0 12px #ff007f, 0 0 25px #ff007f, 0 0 45px #ff007f;
                transform: scale(1);
            }
            50% {
                color: #ffffff;
                text-shadow: 0 0 25px #ff007f, 0 0 50px #ff007f, 0 0 90px #ff007f;
                transform: scale(1.08);
            }
        }

        .tag-twack4lyfe {
            animation: pulse-cyan-glow 2.4s ease-in-out infinite;
            will-change: transform, text-shadow;
        }

        @keyframes rainbow-text-gradient {
            0% { background-position: 0% 50%; }
            50% { background-position: 100% 50%; }
            100% { background-position: 0% 50%; }
        }

        .rainbow-text-outlined {
            background: linear-gradient(90deg, #ff0055, #ff7700, #ffeb3b, #00ff66, #00ffff, #7000ff, #ff0055);
            background-size: 200% auto;
            -webkit-background-clip: text;
            -webkit-text-fill-color: transparent;
            -webkit-text-stroke: 2px #000000;
            filter: drop-shadow(0 0 16px rgba(0, 255, 255, 0.85));
            animation: rainbow-text-gradient 4s linear infinite;
            font-weight: 900;
        }

        @media (min-width: 640px) {
            .rainbow-text-outlined {
                -webkit-text-stroke: 3px #000000;
            }
        }

        /* Neon Strobe Flash Effect for Gateway Buttons */
        @keyframes neon-flash-text {
            0%, 100% {
                color: #ffffff;
                text-shadow: 0 0 10px #00ffff, 0 0 20px #00ffff, 0 0 35px #00ffff;
            }
            25% {
                color: #ffffff;
                text-shadow: 0 0 14px #ff007f, 0 0 28px #ff007f, 0 0 45px #ff007f;
            }
            50% {
                color: #ffffff;
                text-shadow: 0 0 18px #ffeb3b, 0 0 32px #ffeb3b, 0 0 50px #ffeb3b;
            }
            75% {
                color: #ffffff;
                text-shadow: 0 0 14px #00ff66, 0 0 28px #00ff66, 0 0 45px #00ff66;
            }
        }

        @keyframes neon-box-flash {
            0%, 100% {
                box-shadow: 0 0 15px rgba(0, 255, 255, 0.5), inset 0 0 10px rgba(0, 255, 255, 0.3);
            }
            50% {
                box-shadow: 0 0 30px rgba(255, 0, 127, 0.85), inset 0 0 15px rgba(255, 0, 127, 0.5);
            }
        }

        .animate-neon-flash {
            animation: neon-flash-text 2s ease-in-out infinite, neon-box-flash 1.5s ease-in-out infinite;
            will-change: text-shadow, box-shadow;
        }

        /* Shimmer Sweep Animation for Gateway Buttons */
        @keyframes shimmer-sweep {
            0% { transform: translateX(-150%) skewX(-20deg); }
            35%, 100% { transform: translateX(250%) skewX(-20deg); }
        }

        .shimmer-btn {
            position: relative;
            overflow: hidden;
        }

        .shimmer-btn::before {
            content: '';
            position: absolute;
            top: 0;
            left: 0;
            width: 50%;
            height: 100%;
            background: linear-gradient(90deg, transparent, rgba(255, 255, 255, 0.45), transparent);
            transform: translateX(-150%) skewX(-20deg);
            animation: shimmer-sweep 3.5s ease-in-out infinite;
            pointer-events: none;
            z-index: 2;
        }

        /* Distinct High-Impact Gateway Styling */
        .btn-cum-get-sum {
            background: linear-gradient(135deg, rgba(255, 0, 127, 0.45), rgba(255, 183, 3, 0.45)) !important;
            border: 2px solid rgba(255, 183, 3, 0.8) !important;
            box-shadow: 0 0 20px rgba(255, 0, 127, 0.5), inset 0 0 15px rgba(255, 183, 3, 0.3) !important;
        }

        .btn-cum-get-sum:hover {
            transform: scale(1.03) translateY(-2px) !important;
            box-shadow: 0 0 35px rgba(255, 0, 127, 0.85), 0 0 15px rgba(255, 183, 3, 0.9), inset 0 0 20px rgba(255, 255, 255, 0.5) !important;
            border-color: #ffffff !important;
        }

        .btn-tc-video {
            background: linear-gradient(135deg, rgba(0, 255, 255, 0.45), rgba(168, 85, 247, 0.45)) !important;
            border: 2px solid rgba(0, 255, 255, 0.8) !important;
            box-shadow: 0 0 20px rgba(0, 255, 255, 0.5), inset 0 0 15px rgba(168, 85, 247, 0.3) !important;
        }

        .btn-tc-video:hover {
            transform: scale(1.03) translateY(-2px) !important;
            box-shadow: 0 0 35px rgba(0, 255, 255, 0.85), 0 0 15px rgba(168, 85, 247, 0.9), inset 0 0 20px rgba(255, 255, 255, 0.5) !important;
            border-color: #ffffff !important;
        }

        .btn-cyber {
            position: relative;
            color: #ffffff;
            font-weight: 700;
            letter-spacing: 0.08em;
            transition: all 0.25s cubic-bezier(0.1, 0.8, 0.3, 1);
        }

        .btn-cyber:active { transform: translateY(1px) scale(0.98) !important; }

        @keyframes orbital {
            0% { transform: rotate(0deg); }
            100% { transform: rotate(360deg); }
        }

        .animate-orbital { animation: orbital 12s linear infinite; }

        input[type=range] {
            -webkit-appearance: none;
            background: transparent;
        }

        input[type=range]:focus { outline: none; }

        input[type=range]::-webkit-slider-runnable-track {
            width: 100%;
            height: 6px;
            cursor: pointer;
            background: linear-gradient(to right, var(--neon-cyan) var(--volume-percent, 80%), rgba(255, 255, 255, 0.15) var(--volume-percent, 80%));
            border-radius: 999px;
        }

        input[type=range]::-webkit-slider-thumb {
            height: 16px;
            width: 16px;
            border-radius: 50%;
            background: #ffffff;
            box-shadow: 0 0 10px var(--neon-cyan);
            cursor: pointer;
            -webkit-appearance: none;
            margin-top: -5px;
            transition: transform 0.1s ease;
        }

        input[type=range]::-webkit-slider-thumb:hover {
            transform: scale(1.2);
            background: var(--neon-cyan);
        }

        .stagger-in {
            opacity: 0;
            transform: translateY(15px);
            animation: staggerFade 0.6s cubic-bezier(0.1, 0.8, 0.3, 1) forwards;
        }

        @keyframes staggerFade {
            to { opacity: 1; transform: translateY(0); }
        }
    </style>
</head>
<body class="min-h-[100dvh] flex flex-col justify-between items-center selection:bg-cyan-500 selection:text-black antialiased">

        </div>

        <div class="title-backdrop-aura rainbow-border-box stagger-in relative z-10 select-none mb-2.5 sm:mb-4 max-w-xl w-full" style="animation-delay: 0.1s;">
            <h1 class="orbitron font-black text-2xl sm:text-4xl md:text-5xl lg:text-6xl leading-[0.92] tracking-wider uppercase">
                <span class="cyber-title-twack block">TWACK</span>

            </h1>

                <span class="chakra font-bold text-base sm:text-xl md:text-2xl tracking-[0.25em] text-white drop-shadow-[0_0_10px_rgba(255,255,255,0.9)] pl-1">816</span>

            <div class="flex flex-col gap-3 sm:gap-4">

    <!-- Bottom Left Tag -->

    <!-- Toast Notification Container -->
    <div id="toast-container" class="fixed bottom-3 right-3 z-50 pointer-events-none flex flex-col gap-1.5 max-w-[90vw]"></div>

    <script>
        // Global Cyber Toast Manager
        function showCyberToast(message, type = 'info') {
            const container = document.getElementById('toast-container');
            if (!container) return;

            const toast = document.createElement('div');
            toast.className = `pointer-events-auto px-3 py-1.5 rounded-lg font-mono text-xs font-bold border backdrop-blur-md shadow-lg transition-all duration-300 transform translate-y-3 opacity-0 flex items-center gap-1.5`;
            
            if (type === 'error') {
                toast.className += ` bg-red-950/90 text-red-200 border-red-500/60 shadow-red-500/20`;
            } else if (type === 'success') {
                toast.className += ` bg-emerald-950/90 text-emerald-200 border-emerald-500/60 shadow-emerald-500/20`;
            } else {
                toast.className += ` bg-black/90 text-cyan-300 border-cyan-500/60 shadow-cyan-500/20`;
            }

            toast.innerHTML = `<span>⚡</span><span>${message}</span>`;
            container.appendChild(toast);

            requestAnimationFrame(() => {
                toast.classList.remove('translate-y-3', 'opacity-0');
            });

            setTimeout(() => {
                toast.classList.add('translate-y-2', 'opacity-0');
                setTimeout(() => toast.remove(), 250);
            }, 2500);
        }

        // Web Audio Context & Processing Chain
        let audioCtx = null;
        let analyser = null;
        let biquadLow = null;
        let biquadHigh = null;
        let audioSourceNode = null;
        let frequencyData = new Uint8Array(64);
        let timeDomainData = new Uint8Array(64);

        function getAudioContext() {
            if (!audioCtx) {
                try {
                    audioCtx = new (window.AudioContext || window.webkitAudioContext)();
                    
                    analyser = audioCtx.createAnalyser();
                    analyser.fftSize = 128;
                    analyser.smoothingTimeConstant = 0.82;
                    frequencyData = new Uint8Array(analyser.frequencyBinCount);
                    timeDomainData = new Uint8Array(analyser.frequencyBinCount);

                    // Lowshelf Filter (Bass)
                    biquadLow = audioCtx.createBiquadFilter();
                    biquadLow.type = 'lowshelf';
                    biquadLow.frequency.value = 250;
                    biquadLow.gain.value = 0;

                    // Highshelf Filter (Treble)
                    biquadHigh = audioCtx.createBiquadFilter();
                    biquadHigh.type = 'highshelf';
                    biquadHigh.frequency.value = 4000;
                    biquadHigh.gain.value = 0;

                    const audioElem = document.getElementById('twack-audio');
                    if (audioElem && !audioSourceNode) {
                        try {
                            audioSourceNode = audioCtx.createMediaElementSource(audioElem);
                            audioSourceNode.connect(biquadLow);
                            biquadLow.connect(biquadHigh);
                            biquadHigh.connect(analyser);
                            analyser.connect(audioCtx.destination);
                        } catch (err) {
                            console.warn("Media element source connection handled:", err);
                        }
                    }
                } catch (e) {
                    console.warn("Web Audio API not initialized yet:", e);
                }
            }

            if (audioCtx && audioCtx.state === 'suspended') {
                audioCtx.resume();
            }
            return audioCtx;
        }

        function playCyberSound(type = 'beep', freq = 600, duration = 0.07) {
            try {
                const ctx = getAudioContext();
                if (!ctx) return;
                const osc = ctx.createOscillator();
                const gain = ctx.createGain();

                osc.type = 'sine';
                osc.frequency.setValueAtTime(freq, ctx.currentTime);
                gain.gain.setValueAtTime(0.06, ctx.currentTime);
                gain.gain.exponentialRampToValueAtTime(0.001, ctx.currentTime + duration);

                osc.connect(gain);
                gain.connect(ctx.destination);

                osc.start();
                osc.stop(ctx.currentTime + duration);
            } catch (e) {
                // Audio autoplay block ignore
            }
        }

        let fallbackStreamUrl = "https://a8.asurahosting.com/listen/t_c_816/radio.mp3";
        let activeStreamUrl = fallbackStreamUrl;

        function forceHTTPS(url) {
            if (!url) return "";
            return url.startsWith("http://") ? url.replace("http://", "https://") : url;
        }

        async function fetchNowPlaying() {
            let data = null;
            const targetUrl = 'https://a8.asurahosting.com/api/nowplaying/t_c_816';
            const allStationsUrl = 'https://a8.asurahosting.com/api/nowplaying';

            // Multi-tier request pipeline with CORS proxies to guarantee metadata fetching
            const fetchEndpoints = [
                targetUrl,
                allStationsUrl,
                `https://api.allorigins.win/raw?url=${encodeURIComponent(targetUrl)}`,
                `https://corsproxy.io/?${encodeURIComponent(targetUrl)}`,
                `https://api.allorigins.win/raw?url=${encodeURIComponent(allStationsUrl)}`
            ];

            for (const endpoint of fetchEndpoints) {
                try {
                    const controller = new AbortController();
                    const timeoutId = setTimeout(() => controller.abort(), 3500);
                    const response = await fetch(endpoint, { signal: controller.signal });
                    clearTimeout(timeoutId);

                    if (response.ok) {
                        const json = await response.json();
                        if (Array.isArray(json)) {
                            data = json.find(s => 
                                s?.station?.shortcode === 't_c_816' || 
                                String(s?.station?.id) === 't_c_816' || 
                                (s?.station?.listen_url && s.station.listen_url.includes('t_c_816'))
                            ) || json[0];
                        } else if (json && (json.now_playing || json.station)) {
                            data = json;
                        }
                        if (data) break;
                    }
                } catch (err) {
                    // Failover silently to next proxy attempt
                }
            }

            if (data) {
                let displayString = "TRANS-SPECTRUM BROADCAST ACTIVE";

                if (data?.station?.listen_url) {
                    activeStreamUrl = forceHTTPS(data.station.listen_url);
                }

                const song = data?.now_playing?.song;
                if (song) {
                    const artist = song.artist ? song.artist.trim().toUpperCase() : "";
                    const title = song.title ? song.title.trim().toUpperCase() : "";

                    if (artist && title) {
                        displayString = `NOW PLAYING: ${artist} — ${title}`;
                    } else if (song.text) {
                        displayString = `NOW PLAYING: ${song.text.trim().toUpperCase()}`;
                    }
                }

                if (data?.live?.is_live && data?.live?.streamer_name) {
                    displayString = `🔴 LIVE DJ: ${data.live.streamer_name.toUpperCase()} // ${displayString}`;
                }

                const segment = `${displayString} \u00A0\u00A0\u00A0\u00A0\u00A0\u00A0\u00A0\u00A0 • \u00A0\u00A0\u00A0\u00A0\u00A0\u00A0\u00A0\u00A0 `;
                document.getElementById('now-playing-ticker').innerText = segment;
                document.getElementById('now-playing-ticker-repeat').innerText = segment;
            } else {
                const backup = "TWACK CITY 816 // TRANSMITTING FROM KANSAS CITY UNDERGROUND CORE • ";
                document.getElementById('now-playing-ticker').innerText = backup;
                document.getElementById('now-playing-ticker-repeat').innerText = backup;
            }
        }

        fetchNowPlaying();
        setInterval(fetchNowPlaying, 10000);

        const audio = document.getElementById('twack-audio');
        const playBtn = document.getElementById('custom-play-btn');
        const playIcon = document.getElementById('play-icon');
        const pauseIcon = document.getElementById('pause-icon');
        const orbitalRing = document.getElementById('orbital-ring');

        const volumeSlider = document.getElementById('volume-slider');
        const muteBtn = document.getElementById('volume-mute-btn');
        const speakerOnIcon = document.getElementById('speaker-on-icon');
        const speakerMutedIcon = document.getElementById('speaker-muted-icon');

        let isPlaying = false;
        let lastVolume = 80;

        audio.volume = 0.8;

        function updateVolume(val) {
            audio.volume = val / 100;
            volumeSlider.style.setProperty('--volume-percent', `${val}%`);
            volumeSlider.value = val;
            if (val == 0) {
                audio.muted = true;
                speakerOnIcon.classList.add('hidden');
                speakerMutedIcon.classList.remove('hidden');
            } else {
                audio.muted = false;
                speakerOnIcon.classList.remove('hidden');
                speakerMutedIcon.classList.add('hidden');
                lastVolume = val;
            }
        }

        volumeSlider.addEventListener('input', (e) => updateVolume(e.target.value));

        function toggleMute() {
            playCyberSound('beep', 500);
            if (audio.muted || audio.volume === 0) {
                updateVolume(lastVolume > 0 ? lastVolume : 80);
            } else {
                lastVolume = audio.volume * 100;
                updateVolume(0);
            }
        }

        function handlePlaybackStop() {
            isPlaying = false;
            playIcon.classList.remove('hidden');
            pauseIcon.classList.add('hidden');
            orbitalRing.classList.remove('animate-spin');
            orbitalRing.classList.add('animate-orbital');
        }

        function toggleAudioPlayback() {
            getAudioContext();
            playCyberSound('beep', isPlaying ? 400 : 800);

            if (!isPlaying) {
                orbitalRing.classList.remove('animate-orbital');
                orbitalRing.classList.add('animate-spin');

                const streamEndpoint = activeStreamUrl || fallbackStreamUrl;
                const freshUrl = streamEndpoint + (streamEndpoint.includes('?') ? '&' : '?') + 'cb=' + Date.now();
                
                audio.src = freshUrl;
                audio.volume = volumeSlider.value / 100;
                audio.load();

                const playPromise = audio.play();
                if (playPromise !== undefined) {
                    playPromise.then(() => {
                        isPlaying = true;
                        playIcon.classList.add('hidden');
                        pauseIcon.classList.remove('hidden');
                        showCyberToast("STREAM CONNECTED // TRANSMISSION ACTIVE", 'success');
                    }).catch(err => {
                        console.error("Playback prevented by browser policy:", err);
                        handlePlaybackStop();
                        showCyberToast("TAP PLAY AGAIN TO START AUDIO", 'error');
                    });
                }
            } else {
                audio.pause();
                audio.removeAttribute('src');
                audio.load();
                handlePlaybackStop();
                showCyberToast("STREAM PAUSED");
            }
        }

        // Auto Stream Recovery Listeners
        audio.addEventListener('stalled', () => {
            if (isPlaying) showCyberToast("BUFFERING STREAM SIGNAL...", 'info');
        });

        audio.addEventListener('error', () => {
            if (isPlaying) {
                showCyberToast("STREAM DISCONNECTED — RETRYING...", 'error');
                setTimeout(() => { if (isPlaying) toggleAudioPlayback(); }, 2000);
            }
        });

        const vizCanvas = document.getElementById('bg-visualizer');
        const vizCtx = vizCanvas ? vizCanvas.getContext('2d') : null;

        function resizeVizCanvas() {
            if (!vizCanvas || !vizCtx) return;
            const dpr = Math.min(window.devicePixelRatio || 1, 1.5);
            const w = window.innerWidth || document.documentElement.clientWidth;
            const h = window.innerHeight || document.documentElement.clientHeight;
            if (w === 0 || h === 0) return;

            vizCanvas.width = w * dpr;
            vizCanvas.height = h * dpr;
            vizCanvas.style.width = w + 'px';
            vizCanvas.style.height = h + 'px';
            vizCtx.setTransform(1, 0, 0, 1, 0, 0);
            vizCtx.scale(dpr, dpr);
        }

        // ResizeObserver for zero-latency layout updates
        if (typeof ResizeObserver !== 'undefined') {
            const resizeObserver = new ResizeObserver(() => {
                requestAnimationFrame(resizeVizCanvas);
            });
            resizeObserver.observe(document.body);
        }

        window.addEventListener('resize', () => {
            requestAnimationFrame(resizeVizCanvas);
        });

        let vizPhase = 0;

        // Pre-allocated Star particles for Cyber Sky
        const skyStars = Array.from({ length: 45 }, () => ({
            x: Math.random(),
            y: Math.random() * 0.45,
            size: Math.random() * 1.8 + 0.8,
            blink: Math.random() * Math.PI * 2
        }));

        let lastTime = performance.now();
        let frameCount = 0;
        let lastFpsUpdate = performance.now();

        function renderVisualizer(now) {
            if (!vizCtx || !vizCanvas) {
                requestAnimationFrame(renderVisualizer);
                return;
            }

            const w = window.innerWidth || document.documentElement.clientWidth;
            const h = window.innerHeight || document.documentElement.clientHeight;

            if (vizCanvas.width === 0 || vizCanvas.height === 0) {
                resizeVizCanvas();
            }

            // Delta Time Normalization
            const dt = Math.min((now - lastTime) / 1000, 0.1);
            lastTime = now;

            // Telemetry FPS Counter
            frameCount++;
            if (now - lastFpsUpdate >= 500) {
                const fps = Math.round((frameCount * 1000) / (now - lastFpsUpdate));
                const fpsLabel = document.getElementById('telemetry-fps');
                if (fpsLabel) fpsLabel.innerText = `FPS: ${fps}`;
                frameCount = 0;
                lastFpsUpdate = now;
            }

            const cx = w / 2;

            vizCtx.clearRect(0, 0, w, h);
            vizPhase += dt * 2.5;

            const horizonY = h * 0.46;

            // 1. Cyber Sky Stars
            vizCtx.save();
            for (let star of skyStars) {
                const sx = star.x * w;
                const sy = star.y * h;
                const alpha = 0.4 + 0.5 * Math.sin(vizPhase * 2 + star.blink);
                vizCtx.fillStyle = `rgba(0, 255, 255, ${alpha})`;
                vizCtx.beginPath();
                vizCtx.arc(sx, sy, star.size, 0, Math.PI * 2);
                vizCtx.fill();
            }
            vizCtx.restore();

            // 2. Synthwave Ground Perspective Grid
            vizCtx.save();
            vizCtx.strokeStyle = 'rgba(0, 255, 255, 0.22)';
            vizCtx.lineWidth = 1;

            const numGridLines = 14;
            for (let i = -numGridLines; i <= numGridLines; i++) {
                const targetX = cx + (i / numGridLines) * w * 1.5;
                vizCtx.beginPath();
                vizCtx.moveTo(cx, horizonY);
                vizCtx.lineTo(targetX, h);
                vizCtx.stroke();
            }

            const speed = 50;
            const gridZOffset = (vizPhase * speed) % 100;
            for (let z = 10; z < 400; z += 35) {
                const currentZ = z - gridZOffset;
                if (currentZ <= 5) continue;
                const scale = 250 / currentZ;
                const lineY = horizonY + scale * 30;
                if (lineY > horizonY && lineY <= h) {
                    const lineAlpha = Math.min(1, (lineY - horizonY) / (h - horizonY));
                    vizCtx.strokeStyle = `rgba(255, 0, 127, ${lineAlpha * 0.35})`;
                    vizCtx.beginPath();
                    vizCtx.moveTo(0, lineY);
                    vizCtx.lineTo(w, lineY);
                    vizCtx.stroke();
                }
            }
            vizCtx.restore();

            // 3. 3D Cyber-City Flythrough Buildings
            const buildingSlots = 10;
            for (let i = 0; i < buildingSlots; i++) {
                const side = i % 2 === 0 ? -1 : 1;
                const slotIndex = Math.floor(i / 2);
                const flySpeed = 40;
                const zPos = ((slotIndex * 70 + (vizPhase * flySpeed)) % 350) + 15;

                const scale = 260 / zPos;
                const bx = cx + side * (130 + slotIndex * 18) * scale;
                const bw = 60 * scale;

                const audioVal = Math.sin(i + vizPhase) * 35 + 55;
                const bh = (audioVal / 255) * 220 * scale + (50 * scale);
                const by = horizonY - bh;

                const colorPalette = i % 3 === 0 ? '#ffb703' : (i % 3 === 1 ? '#ff007f' : '#00ffff');
                const fillPalette = i % 3 === 0 ? 'rgba(255, 183, 3, 0.16)' : (i % 3 === 1 ? 'rgba(255, 0, 127, 0.16)' : 'rgba(0, 255, 255, 0.16)');

                const drawX = side === -1 ? bx - bw : bx;

                // Building Structure
                vizCtx.fillStyle = fillPalette;
                vizCtx.strokeStyle = colorPalette;
                vizCtx.lineWidth = Math.max(1.5, scale * 1.15);
                vizCtx.fillRect(drawX, by, bw, bh);
                vizCtx.strokeRect(drawX, by, bw, bh);

                // Illuminated Window Grids
                if (bw > 12) {
                    vizCtx.fillStyle = colorPalette;
                    const winCols = 2;
                    const winRows = Math.floor(bh / (14 * scale));
                    const winW = 4 * scale;
                    const winH = 6 * scale;
                    for (let r = 1; r < winRows; r++) {
                        for (let c = 0; c < winCols; c++) {
                            const wx = drawX + (bw / (winCols + 1)) * (c + 1) - winW / 2;
                            const wy = by + r * (14 * scale);
                            if (wy < horizonY - 5) {
                                vizCtx.fillRect(wx, wy, winW, winH);
                            }
                        }
                    }
                }

                // Roof Antenna Spire & Beacon
                vizCtx.beginPath();
                vizCtx.moveTo(drawX + bw / 2, by);
                vizCtx.lineTo(drawX + bw / 2, by - 35 * scale);
                vizCtx.stroke();

                vizCtx.fillStyle = colorPalette;
                vizCtx.beginPath();
                vizCtx.arc(drawX + bw / 2, by - 35 * scale, Math.max(2, 3 * scale), 0, Math.PI * 2);
                vizCtx.fill();
            }

            // 4. Synthwave Horizon Line
            vizCtx.save();
            vizCtx.shadowColor = '#ff007f';
            vizCtx.shadowBlur = 18;
            vizCtx.strokeStyle = '#00ffff';
            vizCtx.lineWidth = 3.5;
            vizCtx.beginPath();
            vizCtx.moveTo(0, horizonY);
            vizCtx.lineTo(w, horizonY);
            vizCtx.stroke();
            vizCtx.restore();

            // Continue rendering loop
            if (!document.hidden) {
                requestAnimationFrame(renderVisualizer);
            }
        }

        // Page Visibility API Handler
        document.addEventListener('visibilitychange', () => {
            if (!document.hidden) {
                lastTime = performance.now();
                requestAnimationFrame(renderVisualizer);
            }
        });

        let isVizRunning = false;
        function initVisualizer() {
            if (isVizRunning) return;
            isVizRunning = true;
            resizeVizCanvas();
            lastTime = performance.now();
            requestAnimationFrame(renderVisualizer);
        }

        // Boot Visualizer Loop instantly
        if (document.readyState === 'complete' || document.readyState === 'interactive') {
            initVisualizer();
        } else {
            document.addEventListener('DOMContentLoaded', initVisualizer);
            window.addEventListener('load', initVisualizer);
        }
    </script>
</body>
</html>
